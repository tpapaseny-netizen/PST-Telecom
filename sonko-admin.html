<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonko Archive TV — Admin</title>
<style>
:root{--bg:#F5F0E8;--card:#FBF8F2;--accent:#1877F2;--accent2:#166FE5;--text:#1C1917;--muted:#57524A;--border:rgba(28,25,23,0.12);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',Arial,sans-serif;padding:20px 14px 60px;}
h1{font-size:20px;margin:0 0 20px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;max-width:560px;margin:0 auto 20px;}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px;color:var(--muted);}
input,textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;background:#fff;color:var(--text);}
textarea{resize:vertical;min-height:180px;}
button{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px;font-weight:800;cursor:pointer;font-size:14px;width:100%;margin-top:16px;}
button.secondary{background:none;color:var(--accent);border:1px solid var(--accent);}
.msg{font-size:13px;margin-top:10px;padding:8px 12px;border-radius:8px;}
.msg.ok{background:#E7F6EC;color:#166534;}
.msg.err{background:#FDECEC;color:#B42318;}
.art-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px;}
.art-row button{width:auto;margin:0;padding:6px 12px;font-size:12px;background:#DC2626;}
.keybox{max-width:560px;margin:0 auto 20px;}
</style>
</head>
<body>

<h1 style="text-align:center;">🛠️ Sonko Archive TV — Admin</h1>

<div class="card keybox" id="keyCard">
  <label>Clé admin (SONKO_ADMIN_KEY définie sur Render)</label>
  <input id="adminKey" type="password" placeholder="Colle ta clé admin ici">
  <button onclick="saveKey()">Se connecter</button>
</div>

<div class="card" id="formCard" style="display:none;">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <h2 style="font-size:16px;margin:0;">Publier un article</h2>
    <button type="button" class="secondary" style="width:auto;margin:0;padding:5px 10px;font-size:11px;" onclick="changeKey()">Changer la clé</button>
  </div>
  <label>Titre</label>
  <input id="fTitle" placeholder="Titre de l'article">
  <label>Résumé court (affiché dans la liste)</label>
  <input id="fExcerpt" placeholder="Une ou deux phrases">
  <label>Image</label>
  <input type="file" id="fImageFile" accept="image/*" onchange="uploadImage()">
  <div id="imgPreviewWrap" style="display:none;margin-top:8px;">
    <img id="imgPreview" style="max-width:100%;border-radius:10px;display:block;margin-bottom:6px;">
    <div id="uploadStatus" style="font-size:12px;color:#57524A;"></div>
  </div>
  <input type="hidden" id="fImage" value="">
  <label>Rubrique</label>
  <select id="fCategory" style="width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;background:#fff;color:var(--text);">
    <option>Actualité</option>
    <option>Politique</option>
    <option>Économie</option>
    <option>Société</option>
    <option>International</option>
    <option>Vidéos</option>
  </select>
  <label>Auteur</label>
  <input id="fAuthor" placeholder="Redaction" value="Redaction">
  <label>Contenu</label>
  <textarea id="fContent" placeholder="Texte complet de l'article"></textarea>
  <button onclick="publish()">Publier</button>
  <div id="msg"></div>
</div>

<div class="card" id="listCard" style="display:none;">
  <h2 style="font-size:16px;margin-top:0;">Articles publiés</h2>
  <div id="artList"></div>
</div>

<script>
function changeKey(){
  localStorage.removeItem('sonko_admin_key');
  document.getElementById('formCard').style.display = 'none';
  document.getElementById('listCard').style.display = 'none';
  document.getElementById('keyCard').style.display = 'block';
  document.getElementById('adminKey').value = '';
}

function getKey(){ return localStorage.getItem('sonko_admin_key') || ''; }
function saveKey(){
  const k = document.getElementById('adminKey').value.trim();
  if(!k) return;
  localStorage.setItem('sonko_admin_key', k);
  document.getElementById('keyCard').style.display = 'none';
  document.getElementById('formCard').style.display = 'block';
  document.getElementById('listCard').style.display = 'block';
  loadList();
}
if(getKey()){
  document.getElementById('keyCard').style.display = 'none';
  document.getElementById('formCard').style.display = 'block';
  document.getElementById('listCard').style.display = 'block';
}

async function uploadImage(){
  const fileInput = document.getElementById('fImageFile');
  const file = fileInput.files[0];
  if(!file) return;
  const wrap = document.getElementById('imgPreviewWrap');
  const status = document.getElementById('uploadStatus');
  const preview = document.getElementById('imgPreview');
  wrap.style.display = 'block';
  preview.src = URL.createObjectURL(file);
  status.textContent = 'Envoi en cours…';
  try{
    const fd = new FormData();
    fd.append('image', file);
    const r = await fetch('/api/sonko/upload-image', {
      method: 'POST',
      headers: {'x-sonko-admin-key': getKey()},
      body: fd
    });
    const j = await r.json();
    if(j.success){
      document.getElementById('fImage').value = j.url;
      status.textContent = 'Image envoyée ✓';
    } else {
      status.textContent = 'Erreur : ' + (j.error || 'envoi échoué');
    }
  }catch(e){ status.textContent = 'Erreur réseau lors de l\u2019envoi.'; }
}

async function publish(){
  const msg = document.getElementById('msg');
  const body = {
    title: document.getElementById('fTitle').value.trim(),
    excerpt: document.getElementById('fExcerpt').value.trim(),
    image_url: document.getElementById('fImage').value.trim(),
    author: document.getElementById('fAuthor').value.trim() || 'Redaction',
    category: document.getElementById('fCategory').value,
    content: document.getElementById('fContent').value.trim(),
  };
  if(!body.title || !body.content){ msg.innerHTML = '<div class="msg err">Titre et contenu obligatoires.</div>'; return; }
  try{
    const r = await fetch('/api/sonko/articles', {
      method: 'POST',
      headers: {'Content-Type':'application/json', 'x-sonko-admin-key': getKey()},
      body: JSON.stringify(body)
    });
    const j = await r.json();
    if(j.success){
      msg.innerHTML = '<div class="msg ok">Publié ! Temps de lecture estimé : ' + j.reading_minutes + ' min.</div>';
      document.getElementById('fTitle').value = '';
      document.getElementById('fExcerpt').value = '';
      document.getElementById('fImage').value = '';
      document.getElementById('fContent').value = '';
      loadList();
    } else if(r.status === 401){
      localStorage.removeItem('sonko_admin_key');
      document.getElementById('formCard').style.display = 'none';
      document.getElementById('listCard').style.display = 'none';
      document.getElementById('keyCard').style.display = 'block';
      document.getElementById('adminKey').value = '';
      msg.innerHTML = '';
      alert('Clé admin incorrecte — retape-la ci-dessus.');
    } else {
      msg.innerHTML = '<div class="msg err">' + (j.error || 'Erreur inconnue.') + '</div>';
    }
  }catch(e){ msg.innerHTML = '<div class="msg err">Erreur réseau.</div>'; }
}

async function loadList(){
  const el = document.getElementById('artList');
  try{
    const r = await fetch('/api/sonko/articles');
    const j = await r.json();
    if(!j.articles || !j.articles.length){ el.innerHTML = '<p style="color:#57524A;font-size:13px;">Aucun article pour le moment.</p>'; return; }
    el.innerHTML = j.articles.map(a => `
      <div class="art-row">
        <span>${a.title}</span>
        <button onclick="del('${a.id}')">Supprimer</button>
      </div>
    `).join('');
  }catch(e){}
}

async function del(id){
  if(!confirm('Supprimer cet article ?')) return;
  try{
    await fetch('/api/sonko/articles/' + id, { method:'DELETE', headers:{'x-sonko-admin-key': getKey()} });
    loadList();
  }catch(e){}
}
</script>
</body>
</html>
