<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Académie Numérique du Sénégal — Espace professeurs</title>
<meta name="theme-color" content="#00653A"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--g:#00853F;--g2:#00653A;--g3:#E8F5EE;--y:#FDEF42;--gold:#E9B200;--r:#E31B23;--ink:#10231A;--mut:#5D7266;--line:#DCE6E0;--bg:#F5F8F6;--card:#fff;--sh:0 6px 24px rgba(0,60,30,.08);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g3:#0F2A1D;--ink:#ECF5EF;--mut:#9DB5A7;--line:#22372B;--bg:#0B1510;--card:#122019;--sh:0 6px 24px rgba(0,0,0,.35);}}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:15px;}
a{color:var(--g);}
button{font-family:inherit;}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 18px;background:linear-gradient(135deg,#00853F,#00653A);color:#fff;box-shadow:0 4px 18px rgba(0,60,30,.25);}
.logo{width:40px;height:40px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;}
.top h1{font-size:16px;margin:0;line-height:1.2;}
.top small{display:block;font-size:12px;opacity:.85;font-weight:600;}
.top .sp{flex:1;}
.top .who{font-size:13px;font-weight:700;opacity:.95;text-align:right;}
.top button{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;border-radius:20px;padding:7px 14px;font-weight:700;cursor:pointer;}
.flag{height:4px;background:linear-gradient(90deg,#00853F 0 33.3%,#FDEF42 33.3% 66.6%,#E31B23 66.6%);}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 60px;}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none;}
.tabs button{flex:none;border:none;border-radius:22px;padding:9px 16px;font-weight:800;font-size:14px;background:var(--card);color:var(--ink);box-shadow:var(--sh);cursor:pointer;}
.tabs button.on{background:var(--g);color:#fff;}
.tabs .n{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--r);color:#fff;font-size:12px;}
.card{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:18px;margin-bottom:14px;}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));}
.kpi{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:16px;}
.kpi b{display:block;font-size:28px;font-weight:800;color:var(--g);}
.kpi span{color:var(--mut);font-size:13px;font-weight:700;}
h2{font-size:20px;margin:0 0 12px;}
h3{font-size:16px;margin:0 0 8px;}
.mut{color:var(--mut);}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.btn{border:none;border-radius:14px;padding:11px 18px;font-weight:800;font-size:14.5px;cursor:pointer;background:var(--g);color:#fff;box-shadow:0 6px 16px rgba(0,133,63,.25);}
.btn:disabled{opacity:.5;cursor:default;}
.btn.ghost{background:var(--g3);color:var(--g2);box-shadow:none;}
.btn.red{background:var(--r);box-shadow:0 6px 16px rgba(227,27,35,.2);}
.btn.gold{background:var(--gold);color:#2A2000;box-shadow:0 6px 16px rgba(233,178,0,.25);}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px;}
label{display:block;font-size:13px;font-weight:800;color:var(--mut);margin:10px 0 6px;}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:13px;padding:11px 13px;font-size:15px;background:var(--card);color:var(--ink);font-family:inherit;outline:none;}
input:focus,select:focus,textarea:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(0,133,63,.15);}
textarea{min-height:110px;resize:vertical;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media (max-width:640px){.two{grid-template-columns:1fr;}.top .who{display:none;}}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:800;}
.b-draft{background:#EEF1F4;color:#4A5568;} .b-pending{background:#FFF4D1;color:#8A6200;} .b-published{background:#DFF5E8;color:#00653A;} .b-rejected{background:#FDE2E3;color:#A50F15;} .b-archived{background:#EEE;color:#777;}
.list > div{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
.list > div:last-child{border-bottom:none;}
.grow{flex:1;min-width:0;}
.ic{width:42px;height:42px;border-radius:12px;background:var(--g3);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;}
.auth{max-width:440px;margin:40px auto;}
.hero{text-align:center;padding:10px 0 6px;}
.hero h2{font-size:24px;}
.seg{display:flex;background:var(--g3);border-radius:14px;padding:4px;margin:6px 0 4px;}
.seg button{flex:1;border:none;background:none;padding:10px;border-radius:11px;font-weight:800;color:var(--g2);cursor:pointer;}
.seg button.on{background:var(--card);box-shadow:var(--sh);}
.err{color:var(--r);font-weight:700;font-size:13.5px;min-height:18px;margin-top:8px;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);opacity:0;background:#10231A;color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;transition:.25s;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90vw;}
.toast.on{opacity:1;transform:translateX(-50%);}
.modal{position:fixed;inset:0;background:rgba(5,20,12,.5);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:30px 12px;overflow-y:auto;}
.modal > div{width:100%;max-width:760px;background:var(--card);border-radius:22px;padding:20px;box-shadow:0 30px 70px rgba(0,0,0,.3);}
.prog{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:8px;}
.prog i{display:block;height:100%;width:0;background:var(--g);transition:width .2s;}
.q{border:1.5px solid var(--line);border-radius:16px;padding:12px;margin:10px 0;}
.q .row input[type=radio]{width:auto;}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chips span{background:var(--g3);color:var(--g2);font-weight:700;font-size:12.5px;padding:4px 10px;border-radius:12px;}
.empty{text-align:center;color:var(--mut);padding:26px 10px;}
.codes{font-family:ui-monospace,Menlo,monospace;font-size:15px;line-height:1.9;columns:3 160px;}
.check{display:flex;align-items:center;gap:8px;font-weight:700;margin-top:10px;}
.check input{width:auto;}
.ai{background:linear-gradient(135deg,#0B4FD1,#7C3AED);color:#fff;box-shadow:0 6px 16px rgba(76,29,149,.3);}
</style>
</head>
<body>
<div class="top"><div class="logo"><svg width="26" height="26" viewBox="0 0 48 48"><path d="M6 14l18-8 18 8-18 8z" fill="#00853F"/><path d="M12 18v10c0 3 5.4 6 12 6s12-3 12-6V18l-12 5z" fill="#00653A"/><path d="M40 16v13" stroke="#E9B200" stroke-width="3" stroke-linecap="round"/><circle cx="40" cy="31" r="3" fill="#E9B200"/><path d="m24 37 1.6 3.3 3.6.5-2.6 2.5.6 3.6-3.2-1.7-3.2 1.7.6-3.6-2.6-2.5 3.6-.5z" fill="#E31B23"/></svg></div>
<div><h1>Académie Numérique du Sénégal</h1><small id="sub">Espace professeurs</small></div><div class="sp"></div><div class="who" id="who"></div><button id="out" style="display:none">Se déconnecter</button></div>
<div class="flag"></div>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script>
(function(){
var API='/api/ans', T=null, ME=null, CAT=null;
try{ T=localStorage.getItem('ans_tok'); }catch(_){}
var $=function(s,r){ return (r||document).querySelector(s); };
function E(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function toast(t){ var x=$('#toast'); x.textContent=t; x.classList.add('on'); clearTimeout(x._t); x._t=setTimeout(function(){ x.classList.remove('on'); },3200); }
async function api(m,u,b){ var r=await fetch(API+u,{method:m,headers:Object.assign({'Content-Type':'application/json'},T?{Authorization:'Bearer '+T}:{}),body:b?JSON.stringify(b):undefined}); var j={}; try{ j=await r.json(); }catch(_){} if(r.status===401 && T){ logout(); throw new Error('Session expirée'); } if(!r.ok) throw new Error(j.error||('Erreur '+r.status)); return j; }
function lvName(c){ var l=(CAT&&CAT.levels||[]).find(function(x){ return x.code===c; }); return l?l.name:(c||''); }
function sbName(c){ var s=(CAT&&CAT.subjects||[]).find(function(x){ return x.code===c; }); return s?(s.icon+' '+s.name):(c||''); }
function stBadge(s){ var L={draft:'Brouillon',pending:'En validation',published:'Publié',rejected:'À revoir',archived:'Archivé'}; return '<span class="badge b-'+E(s)+'">'+(L[s]||s)+'</span>'; }
function fmtSize(n){ n=Number(n||0); if(n>1048576) return (n/1048576).toFixed(1)+' Mo'; if(n>1024) return Math.round(n/1024)+' Ko'; return n?n+' o':''; }
function fcfa(n){ return Number(n||0).toLocaleString('fr-FR')+' FCFA'; }
function logout(){ T=null; ME=null; try{ localStorage.removeItem('ans_tok'); }catch(_){} render(); }
$('#out').onclick=logout;
function modal(html){ var m=document.createElement('div'); m.className='modal'; m.innerHTML='<div>'+html+'</div>'; document.body.appendChild(m); m.addEventListener('click',function(e){ if(e.target===m) m.remove(); }); m.close=function(){ m.remove(); }; return m; }
function ask(msg, okLbl, danger){ return new Promise(function(res){ var m=modal('<h2 style="font-size:18px;">'+E(msg)+'</h2><div class="row" style="justify-content:flex-end;margin-top:14px;"><button class="btn ghost" id="n">Annuler</button><button class="btn'+(danger?' red':'')+'" id="y">'+E(okLbl||'Confirmer')+'</button></div>'); m.querySelector('#n').onclick=function(){ m.close(); res(false); }; m.querySelector('#y').onclick=function(){ m.close(); res(true); }; m.firstChild.style.maxWidth='440px'; m.style.alignItems='center'; }); }
function askText(msg, def, okLbl){ return new Promise(function(res){ var m=modal('<h2 style="font-size:18px;">'+E(msg)+'</h2><textarea id="v" style="min-height:80px;">'+E(def||'')+'</textarea><div class="row" style="justify-content:flex-end;margin-top:14px;"><button class="btn ghost" id="n">Annuler</button><button class="btn" id="y">'+E(okLbl||'Valider')+'</button></div>'); m.querySelector('#n').onclick=function(){ m.close(); res(null); }; m.querySelector('#y').onclick=function(){ var v=m.querySelector('#v').value; m.close(); res(v); }; m.firstChild.style.maxWidth='480px'; m.style.alignItems='center'; setTimeout(function(){ m.querySelector('#v').focus(); },50); }); }
function levelOptions(sel){ return (CAT.levels||[]).map(function(l){ return '<option value="'+l.code+'"'+(l.code===sel?' selected':'')+'>'+E(l.name)+'</option>'; }).join(''); }
function subjOptions(sel){ return (CAT.subjects||[]).map(function(s){ return '<option value="'+s.code+'"'+(s.code===sel?' selected':'')+'>'+E(s.icon+' '+s.name)+'</option>'; }).join(''); }
function serieOptions(level, sel){ var l=(CAT.levels||[]).find(function(x){ return x.code===level; }); if(!l||!l.series) return ''; return '<option value="">Toutes les séries</option>'+l.series.map(function(s){ return '<option'+(s===sel?' selected':'')+'>'+s+'</option>'; }).join(''); }

// ── fichiers : envoi direct au stockage avec barre de progression ──
async function upload(file, kind, bar){
  var ext=(file.name.split('.').pop()||'').toLowerCase();
  var p=await api('POST','/media/presign',{kind:kind,mime:file.type||'application/octet-stream',ext:ext});
  await new Promise(function(res,rej){ var x=new XMLHttpRequest(); x.open('PUT',p.upload_url); x.setRequestHeader('Content-Type',file.type||'application/octet-stream');
    x.upload.onprogress=function(e){ if(e.lengthComputable && bar) bar.style.width=Math.round(e.loaded/e.total*100)+'%'; };
    x.onload=function(){ x.status>=200&&x.status<300?res():rej(new Error('Envoi refusé ('+x.status+')')); }; x.onerror=function(){ rej(new Error('Réseau')); }; x.send(file); });
  var dur=null; if(kind==='video'||kind==='audio'){ dur=await new Promise(function(res){ var v=document.createElement(kind==='video'?'video':'audio'); v.preload='metadata'; v.onloadedmetadata=function(){ res(Math.round(v.duration)||null); URL.revokeObjectURL(v.src); }; v.onerror=function(){ res(null); }; v.src=URL.createObjectURL(file); setTimeout(function(){ res(null); },8000); }); }
  return { url:p.public_url, size:file.size, duration:dur };
}

// ═════ Connexion ═════
function authView(){
  var mode='login';
  $('#app').innerHTML='<div class="auth"><div class="card"><div class="hero"><h2>Bienvenue, professeur 👋</h2><p class="mut">Partagez vos cours avec les élèves du Sénégal, de la CI à la Terminale.</p></div>'
    +'<div class="seg"><button data-m="login" class="on">Se connecter</button><button data-m="reg">Devenir professeur partenaire</button></div>'
    +'<div id="f"></div><div class="err" id="err"></div></div><p class="mut" style="text-align:center;font-size:13px;">Élève ? Téléchargez l’appli de l’Académie sur Google Play.</p></div>';
  function draw(){ $('#f').innerHTML=(mode==='reg'?'<label>Nom complet</label><input id="nm" placeholder="Ex : Fatou Diop" autocomplete="name"/><label>École / établissement</label><input id="sc" placeholder="Ex : Lycée Valdiodio Ndiaye, Kaolack"/><label>Matières enseignées</label><select id="sj" multiple size="5">'+subjOptions('')+'</select>':'')
    +'<label>Téléphone</label><input id="ph" type="tel" placeholder="77 123 45 67" autocomplete="tel"/><label>Mot de passe</label><input id="pw" type="password" placeholder="Au moins 6 caractères" autocomplete="'+(mode==='reg'?'new-password':'current-password')+'"/>'
    +'<button class="btn" id="go" style="width:100%;margin-top:16px;">'+(mode==='reg'?'Envoyer ma candidature':'Se connecter')+'</button>'; $('#go').onclick=go; }
  document.querySelectorAll('.seg button').forEach(function(b){ b.onclick=function(){ mode=b.getAttribute('data-m'); document.querySelectorAll('.seg button').forEach(function(x){ x.classList.toggle('on',x===b); }); draw(); }; });
  async function go(){ $('#err').textContent=''; var b=$('#go'); b.disabled=true;
    try{ var r; if(mode==='reg'){ var sj=[].slice.call($('#sj').selectedOptions).map(function(o){ return o.value; }); r=await api('POST','/auth/register',{name:$('#nm').value,phone:$('#ph').value,password:$('#pw').value,role:'prof',school:$('#sc').value,subjects:sj}); }
      else r=await api('POST','/auth/login',{phone:$('#ph').value,password:$('#pw').value});
      T=r.token; ME=r.user; try{ localStorage.setItem('ans_tok',T); }catch(_){} render(); }
    catch(e){ $('#err').textContent=e.message; b.disabled=false; } }
  draw();
}

// ═════ Espace ═════
var TAB=null;
async function render(){
  try{ if(!CAT) CAT=await api('GET','/catalog'); }catch(e){ $('#app').innerHTML='<div class="card empty">Serveur indisponible : '+E(e.message)+'</div>'; return; }
  if(!T){ $('#who').textContent=''; $('#out').style.display='none'; return authView(); }
  try{ var me=await api('GET','/me'); ME=me.user; }catch(e){ return; }
  $('#who').innerHTML=E(ME.name)+'<br><span style="font-weight:600;opacity:.8">'+(ME.role==='admin'?'Administration':'Professeur')+'</span>'; $('#out').style.display='';
  $('#sub').textContent=ME.role==='admin'?'Administration et professeurs':'Espace professeurs';
  if(ME.role==='prof' && ME.prof_status!=='approved'){ $('#app').innerHTML='<div class="card" style="max-width:560px;margin:30px auto;text-align:center;"><div style="font-size:48px">'+(ME.prof_status==='rejected'?'🙏':'⏳')+'</div><h2>'+(ME.prof_status==='rejected'?'Candidature non retenue pour le moment':'Candidature en cours de validation')+'</h2><p class="mut">'+(ME.prof_status==='rejected'?'Contactez l’Académie pour en savoir plus.':'L’équipe de l’Académie vérifie votre profil. Vous pourrez publier vos cours dès la validation.')+'</p></div>'; return; }
  if(ME.role==='eleve'){ $('#app').innerHTML='<div class="card" style="max-width:560px;margin:30px auto;text-align:center;"><div style="font-size:48px">📱</div><h2>Bonjour '+E(ME.name.split(' ')[0])+' !</h2><p class="mut">Cet espace est réservé aux professeurs. Les cours se suivent dans l’appli de l’Académie, même sans connexion.</p></div>'; return; }
  var tabs=[['cours','📚 Mes cours'],['evals','📝 Évaluations'],['ia','✨ Vidéos IA']];
  if(ME.role==='admin') tabs=[['dash','📊 Tableau de bord'],['vprofs','👩🏾‍🏫 Professeurs'],['vcours','✅ Cours à valider'],['pay','💰 Paiements'],['codes','🎟️ Codes'],['grants','🎓 Bourses'],['users','👥 Utilisateurs'],['set','⚙️ Réglages']].concat(tabs);
  if(!TAB || !tabs.some(function(t){ return t[0]===TAB; })) TAB=tabs[0][0];
  $('#app').innerHTML='<div class="tabs">'+tabs.map(function(t){ return '<button data-t="'+t[0]+'"'+(t[0]===TAB?' class="on"':'')+'>'+t[1]+'</button>'; }).join('')+'</div><div id="view"></div>';
  document.querySelectorAll('.tabs button').forEach(function(b){ b.onclick=function(){ TAB=b.getAttribute('data-t'); document.querySelectorAll('.tabs button').forEach(function(x){ x.classList.toggle('on',x===b); }); show(); }; });
  if(ME.role==='admin'){ try{ var o=await api('GET','/admin/overview'); var nb={vprofs:o.profs_pending,vcours:o.courses.pending,pay:o.payments.to_check,grants:o.grants_pending}; document.querySelectorAll('.tabs button').forEach(function(b){ var n=nb[b.getAttribute('data-t')]; if(n) b.insertAdjacentHTML('beforeend','<span class="n">'+n+'</span>'); }); }catch(_){} }
  show();
}
function show(){ var v=$('#view'); v.innerHTML='<div class="card empty">Chargement…</div>'; var f={cours:vCours,evals:vEvals,ia:vIA,dash:vDash,vprofs:vProfs,vcours:vValid,pay:vPay,codes:vCodes,grants:vGrants,users:vUsers,set:vSet}[TAB]; f(v).catch(function(e){ v.innerHTML='<div class="card empty">'+E(e.message)+'</div>'; }); }

// ── Mes cours ──
async function vCours(v){
  var r=await api('GET','/prof/courses'), s={}; try{ s=await api('GET','/prof/stats'); }catch(_){}
  v.innerHTML='<div class="grid" style="margin-bottom:14px;"><div class="kpi"><b>'+(r.courses||[]).length+'</b><span>cours</span></div><div class="kpi"><b>'+(s.students||0)+'</b><span>élèves qui suivent vos cours</span></div><div class="kpi"><b>'+(s.lessons_done||0)+'</b><span>leçons terminées</span></div><div class="kpi"><b>'+(s.hours||0)+' h</b><span>d’apprentissage</span></div></div>'
    +'<div class="card"><div class="row" style="justify-content:space-between;"><h2 style="margin:0">Mes cours</h2><button class="btn" id="nc">＋ Nouveau cours</button></div><div class="list" id="cl" style="margin-top:8px;"></div></div>';
  $('#cl').innerHTML=(r.courses||[]).filter(function(c){ return c.status!=='archived'; }).map(function(c){ return '<div><div class="ic">'+E((sbName(c.subject)||'📘').split(' ')[0])+'</div><div class="grow"><b>'+E(c.title)+'</b><div class="mut" style="font-size:13px;">'+E(lvName(c.level))+(c.serie?' · '+E(c.serie):'')+' · '+E(sbName(c.subject))+' · '+c.n_lessons+' leçon'+(c.n_lessons>1?'s':'')+' · '+(c.students||0)+' élève'+((c.students||0)>1?'s':'')+'</div>'+(c.status==='rejected'&&c.reject_reason?'<div style="color:var(--r);font-size:13px;font-weight:700;">À revoir : '+E(c.reject_reason)+'</div>':'')+'</div>'+stBadge(c.status)+'<button class="btn ghost sm" data-c="'+c.id+'">Ouvrir</button></div>'; }).join('')||'<div class="empty">Vous n’avez pas encore de cours. Créez le premier !</div>';
  $('#nc').onclick=function(){ courseForm(null); };
  v.querySelectorAll('[data-c]').forEach(function(b){ b.onclick=function(){ courseEdit(b.getAttribute('data-c')); }; });
}
function courseForm(c){
  c=c||{}; var m=modal('<h2>'+(c.id?'Modifier le cours':'Nouveau cours')+'</h2><label>Titre</label><input id="t" value="'+E(c.title||'')+'" placeholder="Ex : Les fractions"/><label>Description</label><textarea id="d" placeholder="Ce que l’élève va apprendre">'+E(c.description||'')+'</textarea>'
    +'<div class="two"><div><label>Classe</label><select id="l">'+levelOptions(c.level||'CM1')+'</select></div><div><label>Matière</label><select id="s">'+subjOptions(c.subject||'math')+'</select></div></div>'
    +'<div class="two"><div><label>Série (lycée)</label><select id="se"></select></div><div><label>Langue</label><select id="lg"><option value="fr">Français</option><option value="wo">Wolof</option><option value="en">Anglais</option><option value="ar">Arabe</option></select></div></div>'
    +'<label>Image de couverture (facultatif)</label><input type="file" id="cv" accept="image/*"/><div class="prog"><i id="cvp"></i></div>'
    +'<label class="check"><input type="checkbox" id="fr"'+(c.free?' checked':'')+'/> Cours gratuit pour tous</label><div class="err" id="err"></div><div class="row" style="justify-content:flex-end;margin-top:12px;"><button class="btn ghost" id="x">Annuler</button><button class="btn" id="ok">'+(c.id?'Enregistrer':'Créer le cours')+'</button></div>');
  $('#lg',m).value=c.lang||'fr';
  function se(){ var h=serieOptions($('#l',m).value, c.serie); $('#se',m).innerHTML=h||'<option value="">—</option>'; $('#se',m).disabled=!h; } se(); $('#l',m).onchange=se;

function quizBuilder(host, qs, level){
  qs=(qs||[]).map(function(q){ return Object.assign({},q); });
  function draw(){
    host.innerHTML=qs.map(function(q,i){ return '<div class="q" data-i="'+i+'"><div class="row"><b style="flex:1">Question '+(i+1)+'</b><select data-f="type" style="width:auto;"><option value="qcm">Choix multiple</option><option value="vf">Vrai / Faux</option><option value="court">Réponse courte</option><option value="long">Réponse rédigée (corrigée par l’IA)</option></select><button class="btn red sm" data-del>✕</button></div>'
      +'<textarea data-f="q" style="min-height:60px;margin-top:8px;" placeholder="Énoncé">'+E(q.q||'')+'</textarea>'
      +(q.type==='qcm'||!q.type?(q.choices||['','','','']).map(function(c,j){ return '<div class="row" style="margin-top:6px;"><input type="radio" name="a'+i+'" data-ans="'+j+'"'+((q.answer|0)===j?' checked':'')+'/><input data-ch="'+j+'" value="'+E(c)+'" placeholder="Choix '+(j+1)+'" style="flex:1"/></div>'; }).join('')+'<div class="mut" style="font-size:12.5px;margin-top:4px;">Cochez la bonne réponse.</div>'
        :q.type==='vf'?'<div class="row" style="margin-top:8px;"><label class="check"><input type="radio" name="a'+i+'" data-ans="0"'+((q.answer|0)===0?' checked':'')+'/> Vrai</label><label class="check"><input type="radio" name="a'+i+'" data-ans="1"'+((q.answer|0)===1?' checked':'')+'/> Faux</label></div>'
        :'<input data-f="answer" value="'+E(typeof q.answer==='string'?q.answer:'')+'" placeholder="Réponse attendue (corrigé)" style="margin-top:8px;"/>')
      +'<input data-f="explain" value="'+E(q.explain||'')+'" placeholder="Explication montrée après la réponse (facultatif)" style="margin-top:8px;"/></div>'; }).join('')+'<button class="btn ghost sm" data-add>＋ Ajouter une question</button>';
    host.querySelectorAll('.q').forEach(function(d){ var i=+d.getAttribute('data-i'); var q=qs[i]; d.querySelector('[data-f="type"]').value=q.type||'qcm';
      d.querySelector('[data-f="type"]').onchange=function(){ q.type=this.value; if(q.type==='vf'){ q.choices=['Vrai','Faux']; q.answer=0; } else if(q.type==='qcm'){ q.choices=['','','','']; q.answer=0; } else { q.choices=[]; q.answer=''; } draw(); };
      d.querySelector('[data-f="q"]').oninput=function(){ q.q=this.value; };
      d.querySelectorAll('[data-ch]').forEach(function(x){ x.oninput=function(){ q.choices=q.choices||[]; q.choices[+x.getAttribute('data-ch')]=x.value; }; });
      d.querySelectorAll('[data-ans]').forEach(function(x){ x.onchange=function(){ q.answer=+x.getAttribute('data-ans'); }; });
      var a=d.querySelector('[data-f="answer"]'); if(a) a.oninput=function(){ q.answer=a.value; };
      d.querySelector('[data-f="explain"]').oninput=function(){ q.explain=this.value; };
      d.querySelector('[data-del]').onclick=function(){ qs.splice(i,1); draw(); }; });
    host.querySelector('[data-add]').onclick=function(){ qs.push({type:'qcm',q:'',choices:['','','',''],answer:0}); draw(); };
  }
  if(!qs.length) qs.push({type:'qcm',q:'',choices:['','','',''],answer:0});
  draw();
  return { get:function(){ return qs; }, set:function(n){ qs=n.map(function(q){ return Object.assign({},q); }); draw(); } };
}

async function vCodes(v){

  $('#go').onclick=async function(){ var b=this; b.disabled=true; try{ var x=await api('POST','/admin/codes',{count:$('#n').value,days:$('#d').value,sponsor:$('#sp').value,school:$('#sc').value}); $('#cout').innerHTML='<p><b>'+x.codes.length+' codes créés</b> — '+x.days+' jours chacun.</p><div class="codes">'+x.codes.join('<br>')+'</div><div class="row" style="margin-top:10px;"><button class="btn ghost sm" id="pr">🖨️ Imprimer les cartes</button><button class="btn ghost sm" id="cp">Copier</button></div>'; $('#pr').onclick=function(){ print(x.codes, x.days+' jours d’accès · '+($('#sp').value||'')); }; $('#cp').onclick=function(){ navigator.clipboard.writeText(x.codes.join('\n')); toast('Codes copiés'); }; }catch(e){ toast(e.message); } b.disabled=false; };
