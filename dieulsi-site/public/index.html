<style>
:root{--b:#1877F2;--bd:#0D4FA8;--nv:#082E63;--cr:#F5F0E8;--cr2:#EAE1D2;--line:#D6E5FC;--ok:#0E9F6E;--bad:#C62828;--card:#FFFFFF;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;background:var(--cr);color:var(--nv);font:500 15px/1.4 Manrope,system-ui,sans-serif;}
button{font:inherit;cursor:pointer;border:0;}
input{font:inherit;}
#map{position:fixed;inset:0;background:#E9E4DA;}
.hide{display:none !important;}
/* Barre du haut */
.top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;pointer-events:none;}
.top>*{pointer-events:auto;}
.brand{display:flex;align-items:center;gap:8px;background:var(--b);color:var(--cr);border-radius:16px;padding:7px 12px 7px 8px;font-weight:800;font-size:17px;box-shadow:0 6px 18px rgba(24,119,242,.3);}
.brand img{width:28px;height:28px;border-radius:8px;}
.grow{flex:1;}
.rbtn{width:44px;height:44px;border-radius:14px;background:#fff;color:var(--b);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(8,46,99,.15);}
.pill{white-space:nowrap;background:#fff;border-radius:20px;padding:8px 12px;font-weight:700;font-size:13px;box-shadow:0 4px 14px rgba(8,46,99,.12);display:flex;align-items:center;gap:6px;}
.dot{width:9px;height:9px;border-radius:50%;background:#9AA6B8;}
.dot.on{background:var(--ok);box-shadow:0 0 0 4px rgba(14,159,110,.18);}
/* Feuille du bas */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-radius:24px 24px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 16px);box-shadow:0 -10px 34px rgba(8,46,99,.16);max-height:78vh;overflow-y:auto;}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--cr2);margin:0 auto 12px;}
.wrapw{max-width:520px;margin:0 auto;}
h2{font-size:20px;margin:0 0 4px;font-weight:800;}
.sub{color:var(--bd);font-size:13.5px;margin:0 0 12px;opacity:.85;}
.big{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border-radius:16px;background:var(--b);color:#fff;font-weight:800;font-size:17px;box-shadow:0 8px 22px rgba(24,119,242,.28);}
.big:active{transform:scale(.98);}
.big:disabled{opacity:.55;box-shadow:none;}
.big.light{background:var(--cr);color:var(--b);box-shadow:none;border:1.5px solid var(--line);}
.big.ok{background:var(--ok);box-shadow:0 8px 22px rgba(14,159,110,.25);}
.big.red{background:#fff;color:var(--bad);border:1.5px solid #F3C7C7;box-shadow:none;}
.row{display:flex;gap:10px;}
.row>*{flex:1;}
.mt{margin-top:10px;}
.field{display:flex;align-items:center;gap:10px;height:54px;border:1.5px solid var(--line);border-radius:15px;padding:0 14px;background:#fff;margin-bottom:10px;}
.field:focus-within{border-color:var(--b);box-shadow:0 0 0 3px rgba(24,119,242,.14);}
.field svg{flex:none;color:var(--b);}
.field input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--nv);font-size:16px;font-weight:600;}
.field input::placeholder{color:#8FA6C8;font-weight:500;}
.where{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--cr);margin-bottom:8px;width:100%;text-align:left;color:var(--nv);}
.where b{display:block;font-size:15px;}
.where small{color:var(--bd);opacity:.8;}
.where .ic{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none;}
.ic.a{background:var(--b);color:#fff;} .ic.z{background:var(--nv);color:#fff;}
.veh{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 12px;}
.vcard{border:2px solid var(--line);border-radius:18px;padding:12px;background:#fff;text-align:left;color:var(--nv);}
.vcard.on{border-color:var(--b);background:#F2F7FF;box-shadow:0 6px 18px rgba(24,119,242,.16);}
.vcard .vi{width:46px;height:46px;border-radius:14px;background:var(--cr);color:var(--b);display:flex;align-items:center;justify-content:center;margin-bottom:6px;}
.vcard.on .vi{background:var(--b);color:#fff;}
.vcard b{display:block;font-size:15px;}
.vcard .pr{font-size:21px;font-weight:800;margin-top:2px;}
.vcard small{color:var(--bd);opacity:.8;font-size:12px;}
.err{color:var(--bad);font-weight:700;font-size:13.5px;min-height:18px;margin:2px 0 6px;}
.note{color:var(--bd);opacity:.8;font-size:13px;}
.center{text-align:center;}
.pulse{width:84px;height:84px;margin:6px auto 10px;border-radius:50%;background:var(--b);color:#fff;display:flex;align-items:center;justify-content:center;position:relative;}
.pulse::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--b);opacity:.4;animation:pl 1.6s ease-out infinite;}
@keyframes pl{from{transform:scale(.8);opacity:.6}to{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.pulse::after{animation:none}}
.drv{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--cr);margin-bottom:10px;}
.av{width:52px;height:52px;border-radius:16px;background:var(--b);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex:none;}
.drv b{display:block;font-size:16px;}
.plate{display:inline-block;margin-top:3px;background:#fff;border:1.5px solid var(--nv);border-radius:7px;padding:1px 7px;font-weight:800;font-size:13px;letter-spacing:.04em;}
.call{width:52px;height:52px;border-radius:16px;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;text-decoration:none;}
.status{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;margin-bottom:8px;}
.price{font-size:34px;font-weight:800;margin:6px 0;}
.stars{display:flex;justify-content:center;gap:8px;margin:10px 0 14px;}
.stars button{background:none;color:#C9D6EA;padding:2px;}
.stars button.on{color:#F4B400;}
.offer{border:2px solid var(--b);border-radius:18px;padding:12px;margin-bottom:10px;background:#F7FAFF;}
.offer .top2{display:flex;justify-content:space-between;align-items:baseline;}
.offer .p{font-size:24px;font-weight:800;}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px;}
.stat3 div{background:var(--cr);border-radius:14px;padding:10px 8px;text-align:center;}
.stat3 b{display:block;font-size:17px;}
.stat3 span{font-size:11.5px;color:var(--bd);}
/* Épingle centrale (choix d'un point sur la carte) */
#pin{position:fixed;left:50%;top:42%;z-index:15;transform:translate(-50%,-100%);pointer-events:none;filter:drop-shadow(0 6px 8px rgba(8,46,99,.35));}
#pin::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:5px;margin-left:-5px;border-radius:50%;background:rgba(8,46,99,.35);}
/* Écran d'accueil / connexion */
#auth{position:fixed;inset:0;z-index:50;background:var(--b);color:var(--cr);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 28px) 18px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;}
#auth .logo{width:84px;height:84px;border-radius:24px;margin:10px auto 14px;box-shadow:0 10px 30px rgba(0,0,0,.18);}
#auth h1{font-size:34px;margin:0;text-align:center;font-weight:800;letter-spacing:-.02em;}
#auth .tag{text-align:center;margin:6px 0 22px;font-size:16px;opacity:.9;}
#auth .card{background:#fff;color:var(--nv);border-radius:24px;padding:18px 16px;width:100%;max-width:440px;margin:0 auto;}
.choice{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:18px;background:var(--cr);color:var(--nv);text-align:left;margin-bottom:10px;}
.choice .vi{width:52px;height:52px;border-radius:16px;background:var(--b);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;}
.choice b{display:block;font-size:17px;}
.choice small{color:var(--bd);}
.seg{display:flex;background:var(--cr);border-radius:14px;padding:4px;margin-bottom:12px;}
.seg button{flex:1;height:42px;border-radius:11px;background:transparent;color:var(--bd);font-weight:800;}
.seg button.on{background:var(--b);color:#fff;}
.lnk{background:none;color:var(--b);font-weight:800;padding:10px;display:block;margin:4px auto 0;}
/* Code de vérification (ybotp1) */
.otp{position:relative;display:flex;gap:7px;justify-content:center;margin:8px 0 6px;}
.otp .bx{flex:1;max-width:50px;height:58px;border:1.5px solid var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:800;color:var(--nv);background:#fff;transition:border-color .15s,box-shadow .15s;}
.otp .bx.full{border-color:var(--b);}
.otp .bx.on{border-color:var(--b);box-shadow:0 0 0 3px rgba(24,119,242,.14);}
.otp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;caret-color:transparent;}
.otp.bad .bx{border-color:var(--bad);animation:shk .32s;}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.otpto{background:var(--cr);border-radius:14px;padding:11px 13px;color:var(--bd);font-size:13.5px;margin:0 0 6px;line-height:1.4;}
.otpto b{color:var(--nv);}
.resend{text-align:center;color:var(--bd);font-size:13.5px;opacity:.85;margin:8px 0 2px;min-height:20px;}
.choice .rec{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:800;background:#E3F5EC;color:var(--ok);border-radius:7px;padding:1px 6px;vertical-align:2px;}
.choice .vi.wa{background:#E3F5EC;color:var(--ok);}
.sign{text-align:center;margin-top:auto;padding-top:18px;font-size:12.5px;opacity:.85;}
/* ybq2 — connexion : tout tient sur un écran, rien ne bouge */
#auth{height:100%;height:100dvh;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 10px);}
#auth .logo{width:66px;height:66px;border-radius:20px;margin:0 auto 8px;flex:none;}
#auth h1{font-size:29px;}
#auth .tag{margin:4px 0 14px;font-size:14.5px;}
#auth .card{padding:16px 14px 10px;}
#auth h2{font-size:19px;}
#auth .sub{margin-bottom:10px;}
#auth .field{height:50px;margin-bottom:8px;}
#auth .big{height:52px;}
#auth .lnk{padding:8px;}
#auth .sign{margin-top:0;padding-top:12px;}
.lnks{display:flex;justify-content:space-between;align-items:center;margin-top:4px;}
.lnks .lnk{margin:0;}
.lnks .lnk.back{color:var(--bd);font-weight:700;}
@media (max-height:720px){ #auth .tag{display:none;} #auth .logo{width:50px;height:50px;border-radius:15px;margin-bottom:4px;} #auth h1{font-size:24px;margin-bottom:10px;} #auth .choice{padding:12px;} #auth .choice .vi{width:44px;height:44px;} #auth .field{height:47px;margin-bottom:7px;} #auth .seg{margin-bottom:8px;} }
@media (max-height:610px){ #auth .logo{display:none;} #auth .sub{display:none;} #auth .field{height:46px;margin-bottom:7px;} #auth .big{height:48px;} #auth .sign{display:none;} #auth h1{font-size:22px;margin-bottom:8px;} #auth .seg button{height:38px;} }
/* ybq2 — trajet */
.mk.c{width:34px;height:34px;background:var(--ok);}
.gps{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ok);margin:2px 0 0;}
.gps.wait{color:var(--bd);} .gps.bad{color:var(--bad);}
.gps i{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none;}
.gps.wait i{animation:blink 1s infinite;} @keyframes blink{50%{opacity:.25}}
.telno{display:inline-block;margin-top:4px;font-weight:800;color:var(--nv);text-decoration:none;font-size:14px;}
.rk{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;border-radius:8px;padding:2px 8px;background:#FFF5D6;color:#8A6200;}
.rk.new{background:#E7F0FE;color:var(--bd);}
.prio{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:-2px 0 10px;}
/* ybq3 — code de départ, partage, SOS */
.pinc{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--nv);color:#fff;border-radius:16px;padding:12px 14px;margin-bottom:10px;}
.pinc b{font-size:34px;letter-spacing:.22em;font-weight:800;}
.pinc span{display:block;font-size:13px;font-weight:600;}
.pinc.now{background:var(--ok);animation:pinpulse 1.6s ease-in-out 3;}
@keyframes pinpulse{50%{transform:scale(1.03)}}
.pinc small{display:block;opacity:.8;font-size:12px;font-weight:600;}
.acts{display:flex;gap:8px;margin-top:10px;}
.acts button{flex:1;height:46px;border-radius:14px;font-weight:800;background:var(--cr);color:var(--b);display:flex;align-items:center;justify-content:center;gap:6px;}
.acts .sos{background:#FDECEC;color:var(--bad);flex:0 0 96px;}
.field.pinf{border-color:var(--b);background:#F4F8FF;}
.field.pinf input{letter-spacing:.3em;font-size:20px;}
.field.pinf input::placeholder{letter-spacing:normal;font-size:16px;}
.field.bad{border-color:var(--bad);animation:shk .32s;}
.chip.rec{background:#E7F0FE;color:var(--bd);}
.slogan{font-weight:700;letter-spacing:.01em;}
.ctry{display:flex;gap:8px;margin-bottom:10px;}
.ctry button{flex:1;height:48px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--nv);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;}
.ctry button.on{border-color:var(--b);background:#EEF5FF;color:var(--b);}
.dial{font-weight:800;color:var(--nv);padding-right:6px;border-right:1.5px solid var(--line);margin-right:2px;}
.langb{background:none;border:0;color:var(--cr);opacity:.9;font-weight:700;font-size:13px;margin:6px auto 0;display:block;text-decoration:underline;}
.wlogo{width:28px;height:28px;border-radius:8px;object-fit:cover;}
.plogo{width:24px;height:24px;border-radius:7px;object-fit:cover;}
#boot{position:fixed;inset:0;z-index:70;background:var(--b);color:var(--cr);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .3s ease;}
#boot img{width:84px;height:84px;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.18);}
#boot b{font-size:30px;font-weight:800;letter-spacing:-.02em;}
#boot span{font-size:14px;opacity:.9;font-weight:700;}
#boot .sg{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);font-size:12.5px;opacity:.85;}
.credp{border:0;font:inherit;font-weight:800;color:var(--nv);cursor:pointer;}
.credp.low{background:#FDECEC;color:var(--bad);}
.rech{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:16px;background:#1DC8F2;color:#06283D;font-weight:800;font-size:16px;margin:0 0 10px;box-shadow:0 8px 20px rgba(29,200,242,.28);}
.rech.low{background:var(--bad);color:#fff;box-shadow:0 8px 20px rgba(198,40,40,.25);}
.pencb{width:52px;height:52px;border-radius:16px;background:var(--b);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;text-decoration:none;font-size:10.5px;font-weight:800;gap:1px;margin-right:6px;}
/* ybq6 — argent, forte demande, zones chaudes */
.mk.hot{width:46px;height:46px;background:rgba(245,124,0,.22);border:2px solid #F57C00;box-shadow:0 0 0 8px rgba(245,124,0,.12);color:#F57C00;font-weight:800;font-size:18px;}
.hotc{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:14px;background:#FFF3E0;color:#7A3E00;margin-bottom:8px;text-align:left;text-decoration:none;}
.hotc b{display:block;font-size:14.5px;color:#5A2D00;}
.hotc small{font-size:12px;}
.hotc .go{margin-left:auto;font-weight:800;color:#F57C00;white-space:nowrap;}
.surge{display:inline-block;margin-top:4px;font-size:11px;font-weight:800;border-radius:7px;padding:1px 6px;background:#FFF3E0;color:#B85C00;}
.vcard s{font-size:12px;opacity:.55;margin-left:4px;}
.sug{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border-radius:16px;background:var(--b);color:#fff;margin-bottom:10px;text-align:left;box-shadow:0 8px 20px rgba(24,119,242,.25);}
.sug small{display:block;opacity:.85;font-size:12px;font-weight:600;}
.sug b{font-size:16px;}
.sug .go{margin-left:auto;font-size:22px;font-weight:800;}
.credc{cursor:pointer;}
.credc span{color:var(--b) !important;font-weight:800;}
.credc.low b{color:var(--bad);}
.freeb{background:#E3F5EC;color:#0B6B4A;border-radius:14px;padding:10px 12px;font-size:13px;font-weight:700;margin-bottom:10px;text-align:center;}
.wal{background:var(--nv);color:#fff;border-radius:20px;padding:16px;text-align:center;margin-bottom:12px;}
.wal small{display:block;opacity:.8;font-weight:600;}
.wal b{display:block;font-size:34px;font-weight:800;margin:2px 0;}
.amts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 10px;}
.amts button{height:46px;border-radius:13px;background:var(--cr);color:var(--nv);font-weight:800;font-size:14px;}
.amts button.on{background:var(--b);color:#fff;}
.stp{display:flex;gap:10px;align-items:flex-start;margin:12px 0 6px;font-weight:800;}
.stp i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--b);color:#fff;font-style:normal;display:flex;align-items:center;justify-content:center;font-size:13px;}
.wave{background:#1DC8F2 !important;color:#06283D !important;box-shadow:0 8px 22px rgba(29,200,242,.3) !important;text-decoration:none;}
.warnb{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:10px 12px;border-radius:14px;background:#FFF5D6;color:#8A6200;font-weight:800;font-size:13px;margin-bottom:10px;text-align:center;}
/* Menu et pages */
.page{position:fixed;inset:0;z-index:60;background:var(--cr);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 20px);}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.ph h2{margin:0;}
.list .it{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:8px;border:1px solid var(--line);}
.it .l1{display:flex;justify-content:space-between;gap:8px;font-weight:800;}
.it .l2{font-size:13px;color:var(--bd);margin-top:2px;}
.tag2{display:inline-block;font-size:11.5px;font-weight:800;border-radius:8px;padding:2px 8px;background:var(--cr);color:var(--bd);}
.tag2.ok{background:#E2F5EC;color:var(--ok);} .tag2.bad{background:#FDECEC;color:var(--bad);} .tag2.b{background:#E6F0FE;color:var(--b);}
.mitem{display:flex;align-items:center;gap:12px;width:100%;padding:15px 14px;background:#fff;border-radius:16px;margin-bottom:8px;color:var(--nv);font-weight:700;text-align:left;border:1px solid var(--line);}
.mitem svg{color:var(--b);}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;}
.tabs button{flex:none;padding:9px 14px;border-radius:12px;background:#fff;color:var(--bd);font-weight:800;border:1px solid var(--line);}
.tabs button.on{background:var(--b);color:#fff;border-color:var(--b);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.kpi{background:#fff;border-radius:16px;padding:12px;border:1px solid var(--line);}
.kpi b{display:block;font-size:22px;}
.kpi span{font-size:12.5px;color:var(--bd);}
.sbtn{padding:8px 12px;border-radius:11px;font-weight:800;font-size:13px;background:var(--b);color:#fff;}
.sbtn.l{background:var(--cr);color:var(--b);} .sbtn.r{background:#FDECEC;color:var(--bad);}
.frm label{display:block;font-weight:800;font-size:12.5px;color:var(--bd);margin:10px 0 4px;}
.frm input{width:100%;height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;color:var(--nv);background:#fff;}
/* Finitions */
#sheetIn.anim>*{animation:shIn .28s ease both;}   /* ybq7 : seulement au changement d'écran */
@keyframes shIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.radar{position:relative;width:110px;height:110px;margin:4px auto 12px;}
.radar i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--b);opacity:0;animation:rd 2.4s ease-out infinite;}
.radar i:nth-child(2){animation-delay:.8s}.radar i:nth-child(3){animation-delay:1.6s}
.radar b{position:absolute;inset:27px;border-radius:50%;background:var(--b);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(24,119,242,.4);}
@keyframes rd{0%{transform:scale(.45);opacity:.7}100%{transform:scale(1.15);opacity:0}}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--cr);color:var(--bd);border-radius:20px;padding:6px 12px;font-weight:700;font-size:13px;margin:2px;}
.big.loading{color:transparent !important;position:relative;pointer-events:none;}
.big.loading::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.45);border-top-color:#fff;animation:sp .7s linear infinite;}
.big.light.loading::after,.big.red.loading::after{border-color:rgba(24,119,242,.25);border-top-color:var(--b);}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.radar i,#sheetIn>*{animation:none}}
/* Boîte de dialogue maison (remplace les fenêtres grises du navigateur) */
#dlg{position:fixed;inset:0;z-index:95;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,46,99,.38);opacity:0;pointer-events:none;transition:opacity .2s;padding:0 0 calc(env(safe-area-inset-bottom,0px) + 12px);}
#dlg.on{opacity:1;pointer-events:auto;}
#dlg .box{width:calc(100% - 24px);max-width:420px;background:#fff;border-radius:26px;padding:22px 18px 16px;text-align:center;transform:translateY(30px) scale(.98);transition:transform .25s cubic-bezier(.2,.9,.3,1.2);box-shadow:0 24px 60px rgba(8,46,99,.3);}
#dlg.on .box{transform:none;}
#dlg .dic{width:62px;height:62px;border-radius:20px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;background:#E6F0FE;color:var(--b);}
#dlg .dic.red{background:#FDECEC;color:var(--bad);}
#dlg h3{margin:0 0 6px;font-size:19px;font-weight:800;color:var(--nv);}

#dlg .big{height:52px;font-size:16px;}
#dlg .big.danger{background:var(--bad);box-shadow:0 8px 22px rgba(198,40,40,.25);}
#dlg .lnk{margin-top:6px;}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);z-index:90;background:var(--nv);color:#fff;padding:11px 16px;border-radius:14px;font-weight:700;font-size:14px;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:opacity .25s;opacity:0;pointer-events:none;}
#toast.on{opacity:1;}

function initMap(){
  if(map || !window.maplibregl) return;
  try{
    map=new maplibregl.Map({ container:'map', style:'https://tiles.openfreemap.org/styles/liberty', center:[S.city.lng,S.city.lat], zoom:13.5, attributionControl:{compact:true}, pitchWithRotate:false, dragRotate:false });
    map.touchZoomRotate.disableRotation();
    map.on('load',function(){ map.addSource('route',{type:'geojson',data:{type:'FeatureCollection',features:[]}}); map.addLayer({id:'route',type:'line',source:'route',paint:{'line-color':'#1877F2','line-width':5,'line-dasharray':[1.4,1.2]}}); drawRoute(); });
    map.on('click',function(e){ onMapTap(e.lngLat); });
  }catch(e){ map=null; }
}
function marker(key, lat, lng, cls, html){
  if(!map) return; if(lat==null||lng==null){ if(mk[key]){ mk[key].remove(); delete mk[key]; } return; }
  if(!mk[key]){ var el=document.createElement('div'); el.className='mk '+cls; el.innerHTML=html||''; mk[key]=new maplibregl.Marker({element:el}).setLngLat([lng,lat]).addTo(map); }
  else mk[key].setLngLat([lng,lat]);
}
function drawRoute(){
  if(!map || !map.getSource || !map.getSource('route')) return;
  var a=null,b=null,geo=null;
  if(S.ride){ a=S.ride.from; b=S.ride.to; geo=S.ride.route; if(S.ride.status==='accepted' && S.ride.driver && S.ride.driver.lat!=null){ b=S.ride.from; a={lat:S.ride.driver.lat,lng:S.ride.driver.lng}; geo=null; } }
  else if(S.from && S.to && (S.step==='choose')){ a=S.from; b=S.to; geo=S.quote&&S.quote.route; }
  var coords=(geo&&geo.length>1)?geo:((a&&b)?[[a.lng,a.lat],[b.lng,b.lat]]:null);
  map.getSource('route').setData({type:'FeatureCollection',features:coords?[{type:'Feature',geometry:{type:'LineString',coordinates:coords}}]:[]});
  try{ map.setPaintProperty('route','line-dasharray',(geo&&geo.length>1)?[1,0]:[1.4,1.2]); }catch(_){}
}
function fit(points){
  if(!map) return; points=points.filter(function(p){ return p && p.lat!=null; }); if(!points.length) return;
  if(points.length===1){ map.easeTo({center:[points[0].lng,points[0].lat],zoom:15,duration:600}); return; }
  var b=new maplibregl.LngLatBounds(); points.forEach(function(p){ b.extend([p.lng,p.lat]); });
  var h=$('#sheet').offsetHeight||300; map.fitBounds(b,{padding:{top:110,bottom:Math.min(h+30,window.innerHeight*0.7),left:50,right:50},maxZoom:16,duration:700});
}
function fitLine(c){ if(!map||!c||c.length<2) return; var b=new maplibregl.LngLatBounds(); c.forEach(function(p){ b.extend(p); }); var h=$('#sheet').offsetHeight||300; map.fitBounds(b,{padding:{top:110,bottom:Math.min(h+30,window.innerHeight*0.7),left:50,right:50},maxZoom:16,duration:700}); }

/* ── GPS du téléphone ── */
var watchId=null;
/* ── Position GPS en 3 temps (ybq4) : dernière position connue (instantané) → position rapide (réseau, < 5 s) → GPS précis en continu ── */
var POS_KEY='yb_lastpos';
function onFix(p, precise){
  var np={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy||999};
  var cur=S.pos;
  // une position rapide moins précise ne remplace pas une position GPS récente
  if(cur && !cur.cached && !precise && np.acc>cur.acc*1.5 && Date.now()-(S.posAt||0)<30000) return;
  var first=!cur||cur.cached, prevAcc=cur?cur.acc:null;
  S.pos=np; S.posAt=Date.now();
  try{ localStorage.setItem(POS_KEY, JSON.stringify({lat:np.lat,lng:np.lng,acc:np.acc,t:Date.now()})); }catch(_){}
  marker('me',np.lat,np.lng,'me');
  if(first && map && !S.ride && (!cur || hav(cur.lat,cur.lng,np.lat,np.lng)>0.3)) map.jumpTo({center:[np.lng,np.lat],zoom:15});   // ybq7 : pas de saut si la position bouge peu
  if(S.me && S.me.role==='client' && S.step==='home' && !S.fromManual){ S.from={lat:np.lat,lng:np.lng}; }
  if(first && S.me && S.me.role==='client' && !S.ride){ _popular=null; }
  var bigChange=prevAcc==null || Math.abs(prevAcc-np.acc)>25;
  if(S.gpsBad){ S.gpsBad=false; bigChange=true; }
  if((first||bigChange) && S.me && S.me.role==='client' && S.step==='home' && !S.ride) renderClient();
}
function quickFix(ms){ return new Promise(function(res){ var done=false, fin=function(){ if(!done){ done=true; res(S.pos); } };
  try{ navigator.geolocation.getCurrentPosition(function(p){ onFix(p,false); fin(); }, fin, {enableHighAccuracy:false,maximumAge:60000,timeout:ms}); }catch(_){ fin(); }
  setTimeout(fin, ms+300); }); }   // ybq8
function startGps(){
  if(!navigator.geolocation || watchId!==null) return;
  if(!S.pos){ try{ var c=JSON.parse(localStorage.getItem(POS_KEY)||'null'); if(c && Date.now()-c.t<1800000){ S.pos={lat:c.lat,lng:c.lng,acc:Math.max(c.acc||0,120),cached:true}; marker('me',c.lat,c.lng,'me'); if(map && !S.ride) map.jumpTo({center:[c.lng,c.lat],zoom:15}); } }catch(_){} }
  var onErr=function(err){ if(err.code===1){ S.gpsBad=true; try{ navigator.geolocation.clearWatch(watchId); }catch(_){} watchId=null; toast('Active la localisation pour Dieulsi dans les réglages du téléphone'); if(S.me && S.me.role==='client' && S.step==='home' && !S.ride) renderClient(); } };
  try{ navigator.geolocation.getCurrentPosition(function(p){ onFix(p,false); }, function(){}, {enableHighAccuracy:false,maximumAge:300000,timeout:5000}); }catch(_){}
  watchId=navigator.geolocation.watchPosition(function(p){ onFix(p,true); }, onErr, {enableHighAccuracy:true,maximumAge:3000,timeout:30000});
}

function buzz(loud){ try{ navigator.vibrate && navigator.vibrate(loud?[300,120,300,120,300]:[150]); }catch(_){}
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); var t=actx.currentTime; [0,0.22].concat(loud?[0.44]:[]).forEach(function(dl){ var o=actx.createOscillator(), g=actx.createGain(); o.type='sine'; o.frequency.value=880; g.gain.setValueAtTime(0.0001,t+dl); g.gain.exponentialRampToValueAtTime(0.4,t+dl+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dl+0.18); o.connect(g); g.connect(actx.destination); o.start(t+dl); o.stop(t+dl+0.2); }); }catch(_){} }
document.addEventListener('pointerdown',function(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); actx.resume&&actx.resume(); }catch(_){} },{once:true});

    +sec('Ta position','Ta position n\'est utilisée que pendant que l\'appli est ouverte : pour placer le départ de ta course, et, pour un chauffeur en ligne, pour lui proposer les courses proches et montrer au client où il se trouve. Nous ne suivons personne en dehors d\'une course.')
    +sec('À quoi ça sert','Uniquement à faire fonctionner le service : relier un client à un chauffeur, calculer le prix, assurer la sécurité (savoir qui a fait quelle course) et gérer la commission. Pas de publicité, pas de revente de données.')
    +sec('Qui voit quoi','Pendant une course, le client voit le nom, la plaque et la position du chauffeur ; le chauffeur voit le nom, le numéro et le point de départ du client. L\'équipe Dieulsi peut consulter les courses en cas de problème.')
    +sec('Où sont les données','Sur des serveurs sécurisés (connexion chiffrée HTTPS). La carte utilise OpenStreetMap.')
    +sec('Supprimer ton compte','Menu ☰ → « Supprimer mon compte », ou la page <a href="#/supprimer-compte">dieulsi.com/#/supprimer-compte</a>. Ton nom, ton numéro et tes informations de chauffeur sont effacés aussitôt ; l\'historique des courses est gardé sans aucun lien avec toi, pour la comptabilité.')
    +sec('Tes questions','Écris à <a href="mailto:contact@dieulsi.com">contact@dieulsi.com</a>.')
    +'</div><p class="note center" style="margin-top:18px">Dernière mise à jour : octobre 2026</p>');
}
function deleteAccount(){
  if(!S.tok || !S.me){
    openPage(ph('Supprimer mon compte')+'<div class="list"><div class="it"><b>Connecte-toi d\'abord</b><div class="l2">Pour supprimer ton compte, connecte-toi avec ton numéro et ton code secret, puis ouvre le menu ☰ → « Supprimer mon compte ».<br/><br/>Tu n\'arrives plus à te connecter ? Écris à <a href="mailto:contact@dieulsi.com">contact@dieulsi.com</a> en indiquant ton numéro : nous supprimons le compte sous 7 jours.</div></div></div>'
      +'<button class="big mt" id="delLogin">Me connecter</button>');
    var b=$('#delLogin'); if(b) b.onclick=function(){ closePage(); try{ if(location.hash) location.hash=''; }catch(_){} };
    return;
  }
  openPage(ph('Supprimer mon compte')
    +'<div class="list"><div class="it"><b>Ce qui sera effacé</b><div class="l2">Ton nom, ton numéro, ton code secret'+(S.me.role==='driver'?' et tes informations de chauffeur (véhicule, plaque)':'')+'. Tu ne pourras plus te connecter avec ce compte. L\'historique des courses est gardé sans lien avec toi.</div></div></div>'
    +'<div class="field" style="margin-top:14px"><input id="delPwd" type="password" inputmode="numeric" placeholder="Ton code secret" autocomplete="current-password"/></div>'
    +'<div class="field"><input id="delWord" placeholder="Écris SUPPRIMER pour confirmer" autocapitalize="characters"/></div>'
    +'<button class="big red mt" id="delGo">Supprimer définitivement</button>');
  $('#delGo').onclick=async function(){
    var b=this, pwd=$('#delPwd').value, w=$('#delWord').value.trim().toUpperCase();
    if(!pwd){ toast('Entre ton code secret'); return; }
    if(w!=='SUPPRIMER' && w!=='DELETE'){ toast('Écris SUPPRIMER pour confirmer'); return; } w='SUPPRIMER';
    b.disabled=true; b.classList.add('loading');
    var r=await api('/me/delete','POST',{ password:pwd, confirm:w });
    b.disabled=false; b.classList.remove('loading');
    if(r.success){ closePage(); toast('Ton compte a été supprimé'); try{ if(location.hash) location.hash=''; }catch(_){} logout(true); }
    else toast(r.error||'Suppression impossible');
  };
}
function _routeHash(){ var h=location.hash||''; var m=h.match(/^#\/suivi\/([a-f0-9]{18})$/); if(m){ if(S.track!==m[1]) startTrack(m[1]); return; } if(h==='#/confidentialite') privacy(); else if(h==='#/supprimer-compte') deleteAccount(); }
window.addEventListener('hashchange', _routeHash);
setTimeout(_routeHash, 700);

/* ── Lancement ── */
try{ S.tok=localStorage.getItem(TOK_KEY); }catch(_){}
var _tm=(location.hash||'').match(/^#\/suivi\/([a-f0-9]{18})$/);
if(_tm){ initMap(); startTrack(_tm[1]); setTimeout(bootDone, 600); } else if(S.tok) boot(); else { initMap(); renderAuth(); setTimeout(bootDone, 250); }
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('/sw.js',{updateViaCache:'none'}).then(function(rg){ try{ rg.update(); }catch(_){} }).catch(function(){}); });
  var _ybHadSW=!!navigator.serviceWorker.controller, _ybReloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){ if(!_ybHadSW || _ybReloaded) return; _ybReloaded=true; if(S.me && S.me.role==='driver' && document.activeElement && document.activeElement.id==='dPin') return; location.reload(); });
  navigator.serviceWorker.addEventListener('message',function(e){ if(e.data && e.data.type==='yb-open' && S.me){ if(S.me.role==='driver') ping(); else if(S.ride) api('/rides/'+S.ride.id).then(function(r){ if(r.ride){ S.ride=r.ride; renderClient(); } }); } }); }
</script>
