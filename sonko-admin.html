<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonko Archives TV — Admin</title>
<style>
:root{--bg:#F5F0E8;--card:#FBF8F2;--accent:#1877F2;--accent2:#166FE5;--text:#1C1917;--muted:#57524A;--border:rgba(28,25,23,0.12);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',Arial,sans-serif;padding:20px 14px 60px;}
h1{font-size:20px;margin:0 0 20px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;max-width:560px;margin:0 auto 20px;}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px;color:var(--muted);}
input,textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;background:#fff;color:var(--text);}
textarea{resize:vertical;min-height:180px;}
button{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px;font-weight:800;cursor:pointer;font-size:14px;width:100%;margin-top:16px;}
button.secondary{background:none;color:var(--accent);border:1px solid var(--accent);}
.msg{font-size:13px;margin-top:10px;padding:8px 12px;border-radius:8px;}
.msg.ok{background:#E7F6EC;color:#166534;}
.msg.err{background:#FDECEC;color:#B42318;}
.art-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px;}
.art-row button{width:auto;margin:0;padding:6px 12px;font-size:12px;background:#DC2626;}
.art-row .edit-btn{background:var(--accent);margin-right:6px;}
.keybox{max-width:560px;margin:0 auto 20px;}
</style>
</head>
<body>

<h1 style="text-align:center;">🛠️ Sonko Archives TV — Admin</h1>

<div class="card keybox" id="keyCard">
  <label>Clé admin (SONKO_ADMIN_KEY définie sur Render)</label>
  <input id="adminKey" type="password" placeholder="Colle ta clé admin ici">
  <button onclick="saveKey()">Se connecter</button>
</div>

<div class="card" id="formCard" style="display:none;">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <h2 style="font-size:16px;margin:0;">Publier un article</h2>
    <button type="button" class="secondary" style="width:auto;margin:0;padding:5px 10px;font-size:11px;" onclick="changeKey()">Changer la clé</button>
  </div>
  <label>Titre</label>
  <input id="fTitle" placeholder="Titre de l'article">
  <label>Résumé court (affiché dans la liste)</label>
  <input id="fExcerpt" placeholder="Une ou deux phrases">
  <label>Image</label>
  <input type="file" id="fImageFile" accept="image/*" onchange="uploadImage()">
  <div id="imgPreviewWrap" style="display:none;margin-top:8px;">
    <img id="imgPreview" style="max-width:100%;border-radius:10px;display:block;margin-bottom:6px;">
    <div id="uploadStatus" style="font-size:12px;color:#57524A;"></div>
  </div>
  <input type="hidden" id="fImage" value="">
  <label>Vidéo (optionnel)</label>
  <input id="fVideoLink" placeholder="Lien YouTube ou Facebook (ex: https://youtube.com/watch?v=...)" oninput="document.getElementById('fVideo').value=this.value">
  <div style="text-align:center;color:#57524A;font-size:12px;margin:4px 0;">— ou —</div>
  <input type="file" id="fVideoFile" accept="video/*" onchange="uploadVideo()">
  <div id="videoStatus" style="font-size:12px;color:#57524A;margin-top:4px;"></div>
  <input type="hidden" id="fVideo" value="">
  <label>Rubrique</label>
  <select id="fCategory" style="width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;background:#fff;color:var(--text);">
    <option>Actualité</option>
    <option>Politique</option>
    <option>Économie</option>
    <option>Société</option>
    <option>International</option>
    <option>Vidéos</option>
  </select>
  <label>Étiquettes (séparées par des virgules)</label>
  <input id="fTags" placeholder="ex: DPG, Économie, Assemblée nationale">
  <label>Auteur</label>
  <input id="fAuthor" placeholder="Redaction" value="Redaction">
  <label>Contenu</label>
  <textarea id="fContent" placeholder="Texte complet de l'article"></textarea>
  <button id="publishBtn" onclick="publish()">Publier</button>
  <div id="msg"></div>
</div>

<div class="card" id="listCard" style="display:none;">
  <h2 style="font-size:16px;margin-top:0;">Articles publiés</h2>
  <div id="artList"></div>
</div>

<div class="card" id="commentsCard" style="display:none;">
  <h2 style="font-size:16px;margin-top:0;">Commentaires (tous articles)</h2>
  <div id="commentsList"></div>
</div>

<script>
function changeKey(){
  localStorage.removeItem('sonko_admin_key');
  document.getElementById('formCard').style.display = 'none';
  document.getElementById('listCard').style.display = 'none';
  document.getElementById('commentsCard').style.display = 'none';
  document.getElementById('keyCard').style.display = 'block';
  document.getElementById('adminKey').value = '';
}

function getKey(){ return localStorage.getItem('sonko_admin_key') || ''; }
function saveKey(){
  const k = document.getElementById('adminKey').value.trim();
  if(!k) return;
  localStorage.setItem('sonko_admin_key', k);
  document.getElementById('keyCard').style.display = 'none';
  document.getElementById('formCard').style.display = 'block';
  document.getElementById('listCard').style.display = 'block';
  document.getElementById('commentsCard').style.display = 'block';
  loadList();
  loadComments();
}
if(getKey()){
  document.getElementById('keyCard').style.display = 'none';
  document.getElementById('formCard').style.display = 'block';
  document.getElementById('listCard').style.display = 'block';
  document.getElementById('commentsCard').style.display = 'block';
  loadComments();
}

async function uploadVideo(){
  const fileInput = document.getElementById('fVideoFile');
  const file = fileInput.files[0];
  if(!file) return;
  const status = document.getElementById('videoStatus');
  status.textContent = 'Envoi en cours… (peut prendre un moment selon la taille)';
  try{
    const fd = new FormData();
    fd.append('video', file);
    const r = await fetch('/api/sonko/upload-video', {
      method: 'POST',
      headers: {'x-sonko-admin-key': getKey()},
      body: fd
    });
    const j = await r.json();
    if(j.success){
      document.getElementById('fVideo').value = j.url;
      document.getElementById('fVideoLink').value = '';
      status.textContent = 'Vidéo envoyée ✓';
    } else {
      status.textContent = 'Erreur : ' + (j.error || 'envoi échoué');
    }
  }catch(e){ status.textContent = 'Erreur réseau lors de l\u2019envoi.'; }
}

async function uploadImage(){
  const fileInput = document.getElementById('fImageFile');
  const file = fileInput.files[0];
  if(!file) return;
  const wrap = document.getElementById('imgPreviewWrap');
  const status = document.getElementById('uploadStatus');
  const preview = document.getElementById('imgPreview');
  wrap.style.display = 'block';
  preview.src = URL.createObjectURL(file);
  status.textContent = 'Envoi en cours…';
  try{
    const fd = new FormData();
    fd.append('image', file);
    const r = await fetch('/api/sonko/upload-image', {
      method: 'POST',
      headers: {'x-sonko-admin-key': getKey()},
      body: fd
    });
    const j = await r.json();
    if(j.success){
      document.getElementById('fImage').value = j.url;
      status.textContent = 'Image envoyée ✓';
    } else {
      status.textContent = 'Erreur : ' + (j.error || 'envoi échoué');
    }
  }catch(e){ status.textContent = 'Erreur réseau lors de l\u2019envoi.'; }
}

let editingId = null;

async function editArticle(id){
  const msg = document.getElementById('msg');
  try{
    const r = await fetch('/api/sonko/admin/articles/' + id, { headers:{'x-sonko-admin-key': getKey()} });
    const j = await r.json();
    if(!j.article){ msg.innerHTML = '<div class="msg err">Article introuvable.</div>'; return; }
    const a = j.article;
    document.getElementById('fTitle').value = a.title || '';
    document.getElementById('fExcerpt').value = a.excerpt || '';
    document.getElementById('fImage').value = a.image_url || '';
    document.getElementById('fVideo').value = a.video_url || '';
    document.getElementById('fVideoLink').value = (a.video_url && (a.video_url.includes('youtube') || a.video_url.includes('facebook'))) ? a.video_url : '';
    document.getElementById('fAuthor').value = a.author || 'Redaction';
    document.getElementById('fCategory').value = a.category || 'Actualité';
    document.getElementById('fTags').value = a.tags || '';
    document.getElementById('fContent').value = a.content || '';
    if(a.image_url){
      document.getElementById('imgPreviewWrap').style.display = 'block';
      document.getElementById('imgPreview').src = a.image_url;
      document.getElementById('uploadStatus').textContent = 'Image actuelle (choisis un fichier pour la remplacer).';
    }
    editingId = id;
    document.getElementById('publishBtn').textContent = 'Mettre à jour';
    window.scrollTo(0,0);
  }catch(e){ msg.innerHTML = '<div class="msg err">Erreur réseau.</div>'; }
}

async function publish(){
  const msg = document.getElementById('msg');
  const body = {
    title: document.getElementById('fTitle').value.trim(),
    excerpt: document.getElementById('fExcerpt').value.trim(),
    image_url: document.getElementById('fImage').value.trim(),
    video_url: document.getElementById('fVideo').value.trim(),
    author: document.getElementById('fAuthor').value.trim() || 'Redaction',
    category: document.getElementById('fCategory').value,
    tags: document.getElementById('fTags').value.trim(),
    content: document.getElementById('fContent').value.trim(),
  };
  if(!body.title || !body.content){ msg.innerHTML = '<div class="msg err">Titre et contenu obligatoires.</div>'; return; }
  try{
    const url = editingId ? ('/api/sonko/articles/' + editingId) : '/api/sonko/articles';
    const method = editingId ? 'PUT' : 'POST';
    const r = await fetch(url, {
      method,
      headers: {'Content-Type':'application/json', 'x-sonko-admin-key': getKey()},
      body: JSON.stringify(body)
    });
    const j = await r.json();
    if(j.success){
      msg.innerHTML = '<div class="msg ok">' + (editingId ? 'Article mis à jour !' : 'Publié !') + ' Temps de lecture estimé : ' + j.reading_minutes + ' min.</div>';
      document.getElementById('fTitle').value = '';
      document.getElementById('fExcerpt').value = '';
      document.getElementById('fImage').value = '';
      document.getElementById('fVideo').value = '';
      document.getElementById('fVideoLink').value = '';
      document.getElementById('videoStatus').textContent = '';
      document.getElementById('fContent').value = '';
      document.getElementById('fTags').value = '';
      document.getElementById('imgPreviewWrap').style.display = 'none';
      editingId = null;
      document.getElementById('publishBtn').textContent = 'Publier';
      loadList();
    } else if(r.status === 401){
      localStorage.removeItem('sonko_admin_key');
      document.getElementById('formCard').style.display = 'none';
      document.getElementById('listCard').style.display = 'none';
      document.getElementById('commentsCard').style.display = 'none';
      document.getElementById('keyCard').style.display = 'block';
      document.getElementById('adminKey').value = '';
      msg.innerHTML = '';
      alert('Clé admin incorrecte — retape-la ci-dessus.');
    } else {
      msg.innerHTML = '<div class="msg err">' + (j.error || 'Erreur inconnue.') + '</div>';
    }
  }catch(e){ msg.innerHTML = '<div class="msg err">Erreur réseau.</div>'; }
}

async function loadList(){
  const el = document.getElementById('artList');
  try{
    const r = await fetch('/api/sonko/articles');
    const j = await r.json();
    if(!j.articles || !j.articles.length){ el.innerHTML = '<p style="color:#57524A;font-size:13px;">Aucun article pour le moment.</p>'; return; }
    el.innerHTML = j.articles.map(a => `
      <div class="art-row">
        <span>${a.title}</span>
        <span>
          <button class="edit-btn" onclick="editArticle('${a.id}')">Éditer</button>
          <button class="edit-btn" onclick="copyLink('${a.id}')">Copier le lien</button>
          <button onclick="del('${a.id}')">Supprimer</button>
        </span>
      </div>
    `).join('');
  }catch(e){}
}

async function copyLink(id){
  const url = location.origin + '/sonko/a/' + id;
  try{
    await navigator.clipboard.writeText(url);
    alert('Lien copié : ' + url);
  }catch(e){ prompt('Copie ce lien :', url); }
}

async function loadComments(){
  const el = document.getElementById('commentsList');
  try{
    const r = await fetch('/api/sonko/admin/comments', { headers:{'x-sonko-admin-key': getKey()} });
    const j = await r.json();
    if(!j.comments || !j.comments.length){ el.innerHTML = '<p style="color:#57524A;font-size:13px;">Aucun commentaire pour le moment.</p>'; return; }
    el.innerHTML = j.comments.map(c => `
      <div class="art-row" style="align-items:flex-start;flex-direction:column;gap:4px;">
        <div style="display:flex;justify-content:space-between;width:100%;">
          <b style="font-size:13px;">${c.name}</b>
          <button onclick="delComment('${c.id}')" style="width:auto;padding:4px 10px;font-size:11px;">Supprimer</button>
        </div>
        <div style="font-size:13px;">${c.content}</div>
        <div style="font-size:11px;color:#57524A;">sur « ${c.article_title || 'article supprimé'} »</div>
      </div>
    `).join('');
  }catch(e){ el.innerHTML = '<p style="color:#B42318;font-size:13px;">Erreur de chargement.</p>'; }
}
async function delComment(id){
  if(!confirm('Supprimer ce commentaire ?')) return;
  try{
    await fetch('/api/sonko/admin/comments/' + id, { method:'DELETE', headers:{'x-sonko-admin-key': getKey()} });
    loadComments();
  }catch(e){}
}

async function del(id){
  if(!confirm('Supprimer cet article ?')) return;
  try{
    await fetch('/api/sonko/articles/' + id, { method:'DELETE', headers:{'x-sonko-admin-key': getKey()} });
    loadList();
  }catch(e){}
}
</script>
</body>
</html>
