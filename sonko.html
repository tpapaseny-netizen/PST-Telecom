<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title><!--OG_TITLE-->Sonko Archives TV — Actualités</title>
<meta name="description" content="<!--OG_DESC-->Sonko Archives TV — actualités, archives et analyses.">
<meta property="og:type" content="article">
<meta property="og:site_name" content="Sonko Archives TV">
<meta property="og:title" content="<!--OG_TITLE-->Sonko Archives TV — Actualités">
<meta property="og:description" content="<!--OG_DESC-->Sonko Archives TV — actualités, archives et analyses.">
<meta property="og:image" content="<!--OG_IMAGE-->">
<meta property="og:url" content="<!--OG_URL-->">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700;8..60,900&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Palette "presse" aux couleurs Penc : papier chaud (inchangé, déjà bon), encre presque
     noire, et le bleu de Penc comme couleur d'accent — pour que Sonko Archives TV s'inscrive
     visuellement dans le même univers que l'app mère, sans perdre l'identité "journal". */
  --paper:#F6F2E9; --paper2:#EFE9DA; --card:#FFFFFF;
  --ink:#1C1712; --ink-soft:#5B5347; --rule:#DCD4C0;
  --red:#1877F2; --red-dark:#0D5DC7;
  --tag:#26221D;
  --shadow:0 2px 14px rgba(28,23,18,0.08);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',Arial,sans-serif;}
a{color:inherit;text-decoration:none;}
h1,h2,h3{font-family:'Source Serif 4',Georgia,serif;}

header{position:sticky;top:0;z-index:50;background:var(--red);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:11px;box-shadow:var(--shadow);}
header .logo{width:36px;height:36px;border-radius:3px;background:#fff;color:var(--red);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px;flex-shrink:0;font-family:'Source Serif 4',Georgia,serif;}
header h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.2px;}
header .tag{font-size:11px;opacity:.88;margin-top:1px;font-style:italic;}
.datebar{background:var(--paper2);border-bottom:1px solid var(--rule);padding:7px 18px;font-size:12.5px;color:var(--ink-soft);}
.datebar b{color:var(--red);font-weight:700;}

main{max-width:760px;margin:0 auto;padding:18px 14px 40px;}

.announce-bar{background:var(--red);color:#fff;padding:10px 0;font-size:13px;font-weight:600;display:flex;align-items:center;gap:10px;overflow:hidden;position:relative;}
.announce-bar .ann-track{white-space:nowrap;display:inline-block;padding-left:100%;animation:ann-scroll 22s linear infinite;}
.announce-bar .ann-track span{padding:0 40px;}
@keyframes ann-scroll{ from{ transform:translateX(0); } to{ transform:translateX(-100%); } }
.announce-bar a{text-decoration:underline;font-weight:700;}
.announce-bar .ann-x{cursor:pointer;opacity:.85;font-weight:900;font-size:15px;line-height:1;flex-shrink:0;padding-right:14px;}
.announce-bar .ann-x:hover{opacity:1;}
@media (prefers-reduced-motion: reduce){ .announce-bar .ann-track{ animation:none; padding-left:16px; } }

/* ---- Navigation par rubriques : bandeau plat, pas de pilules ---- */
.cat-tabs{display:flex;flex-wrap:wrap;gap:0;margin-bottom:20px;border-bottom:1px solid var(--rule);}
.cat-tab{background:none;border:none;border-bottom:3px solid transparent;padding:8px 14px 9px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink-soft);font-family:inherit;}
.cat-tab.active{color:var(--red);border-bottom-color:var(--red);}
.cat-badge{display:inline-block;background:var(--tag);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.4px;padding:4px 9px;margin-bottom:9px;}
.read-cta{color:var(--red);font-weight:700;font-size:13px;margin-top:9px;display:flex;align-items:center;gap:4px;}

/* ---- À la une : grand article vedette ---- */
.hero-card{background:var(--card);border:1px solid var(--rule);margin-bottom:22px;cursor:pointer;overflow:hidden;}
.hero-card img{width:100%;height:230px;object-fit:cover;display:block;background:var(--paper2);}
.hero-card .body{padding:16px 18px 20px;}
.hero-card h2{font-size:25px;margin:0 0 8px;font-weight:700;line-height:1.22;}
.hero-card p{font-size:14.5px;color:var(--ink-soft);margin:0 0 8px;line-height:1.55;}
.une-eyebrow{font-size:11.5px;font-weight:700;color:var(--red);letter-spacing:.5px;margin-bottom:6px;}

/* ---- Module "articles les plus lus" ---- */
.popular-box{border:1px solid var(--rule);background:var(--card);padding:16px 18px 18px;margin-bottom:22px;}
.popular-box h3{font-size:14px;margin:0 0 12px;font-weight:700;color:var(--ink);}
.popular-item{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--rule);font-size:14px;cursor:pointer;line-height:1.4;}
.popular-item:first-of-type{border-top:none;}
.popular-item .sq{color:var(--red);flex-shrink:0;font-size:10px;margin-top:5px;}

/* ---- Accueil : liste d'articles ---- */
.art-card{background:var(--card);border:1px solid var(--rule);display:flex;gap:0;margin-bottom:14px;cursor:pointer;}
.art-card img{width:118px;min-width:118px;height:100%;object-fit:cover;display:block;background:var(--paper2);}
.art-card .body{padding:12px 14px;min-width:0;}
.art-card h2{font-size:16px;margin:0 0 5px;font-weight:700;line-height:1.3;}
.art-card p{font-size:13px;color:var(--ink-soft);margin:0 0 6px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.art-meta{display:flex;gap:8px;font-size:11.5px;color:var(--ink-soft);align-items:center;flex-wrap:wrap;}
.art-meta .sep{color:var(--rule);}

/* ---- Article ---- */
.back-btn{display:inline-flex;align-items:center;gap:6px;color:var(--red);font-weight:700;font-size:14px;margin-bottom:16px;cursor:pointer;background:none;border:none;padding:0;font-family:inherit;}
.art-hero{width:100%;max-height:380px;object-fit:cover;margin-bottom:16px;background:var(--paper2);display:block;}
.art-video-wrap{position:relative;width:100%;padding-top:56.25%;overflow:hidden;margin-bottom:16px;background:#000;}
.art-video-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:none;}
.art-video-file{width:100%;margin-bottom:16px;background:#000;max-height:400px;}
.art-title{font-size:27px;font-weight:700;line-height:1.24;margin:0 0 12px;}
.art-meta-row{display:flex;gap:9px;flex-wrap:wrap;font-size:13px;color:var(--ink-soft);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:10px 0;margin-bottom:18px;}
.art-meta-row .sep{color:var(--rule);}

.art-toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px;}
.tb-btn{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--red);border-radius:0;padding:8px 13px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--red);font-family:inherit;}
.tb-btn.active{background:var(--red);color:#fff;}
.rate-group{display:flex;border:1px solid var(--red);}
.rate-btn{border:none;background:none;padding:8px 10px;font-size:12px;font-weight:700;cursor:pointer;color:var(--red);font-family:inherit;}
.rate-btn+.rate-btn{border-left:1px solid var(--red);}
.rate-btn.active{background:var(--red);color:#fff;}
.tb-btn svg{width:14px;height:14px;}
.art-content{font-size:16.5px;line-height:1.8;}
.art-content p{margin:0 0 18px;}
.tts-chunk{transition:background .25s;}
.tts-chunk.tts-active{background:rgba(174,31,38,0.16);box-shadow:0 0 0 3px rgba(174,31,38,0.16);}

.summary-box{background:var(--paper2);border-left:4px solid var(--red);padding:14px 16px;margin:18px 0;}
.summary-box .sb-head{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;color:var(--red-dark);margin-bottom:4px;}
.summary-box .sb-cap{font-size:11px;color:var(--ink-soft);margin-top:8px;}
.tag-list{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0;}
.tag-pill{background:var(--paper2);padding:6px 12px;font-size:12px;font-weight:700;color:var(--ink-soft);}

/* ---- Partage : bloc explicite par réseau, comme la presse traditionnelle ---- */
.share-box{border:1px dashed var(--rule);padding:16px 18px;margin:24px 0;}
.share-box h4{font-size:13px;margin:0 0 12px;font-weight:700;letter-spacing:.3px;}
.share-grid{display:flex;flex-wrap:wrap;gap:8px;}
.share-net{display:flex;align-items:center;gap:7px;padding:8px 13px;font-size:12.5px;font-weight:700;color:#fff;cursor:pointer;border:none;font-family:inherit;}
.share-net svg{width:15px;height:15px;fill:#fff;}
.sn-fb{background:#1877F2;} .sn-x{background:#0F1419;} .sn-wa{background:#25D366;}
.sn-tg{background:#26A5E4;} .sn-mail{background:#57524A;} .sn-dl{background:var(--ink);}

.reactions{display:flex;gap:8px;margin:8px 0 10px;flex-wrap:wrap;}
.react-btn{background:var(--card);border:1px solid var(--rule);padding:6px 12px;font-size:14px;cursor:pointer;display:flex;gap:6px;align-items:center;font-family:inherit;}
.react-btn .n{font-size:12px;color:var(--ink-soft);font-weight:700;}

.comments{margin-top:30px;border-top:1px solid var(--rule);padding-top:18px;}
.comments h3{font-size:16px;margin:0 0 12px;font-weight:700;}
.c-item{background:var(--paper2);padding:10px 14px;margin-bottom:8px;}
.c-item .name{font-weight:700;font-size:13px;color:var(--red);}
.c-item .txt{font-size:14px;margin-top:2px;}
.edit-c-btn{background:none;border:none;color:var(--red);font-weight:700;font-size:12px;cursor:pointer;padding:6px 0 0;font-family:inherit;}
.c-form{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
.c-form input,.c-form textarea{border:1px solid var(--rule);padding:10px 12px;font-size:14px;font-family:inherit;background:var(--card);color:var(--ink);resize:vertical;}
.c-form button{background:var(--red);color:#fff;border:none;padding:11px;font-weight:700;cursor:pointer;font-size:14px;font-family:inherit;}
.c-form button:hover{background:var(--red-dark);}

.ad-slot{margin:22px 0;text-align:center;min-height:90px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:12px;border:1px dashed var(--rule);}

.empty{text-align:center;color:var(--ink-soft);padding:60px 20px;font-size:14px;}
.loader{text-align:center;padding:40px;color:var(--ink-soft);font-size:14px;}

footer{border-top:3px solid var(--red);background:var(--tag);color:#EFE9DA;padding:26px 18px 22px;margin-top:10px;}
footer .ft-inner{max-width:760px;margin:0 auto;}
footer .ft-name{font-family:'Source Serif 4',Georgia,serif;font-size:18px;font-weight:700;color:#fff;margin-bottom:4px;}
footer .ft-tag{font-size:12.5px;opacity:.75;font-style:italic;margin-bottom:14px;}
footer .ft-copy{font-size:11.5px;opacity:.6;border-top:1px solid rgba(255,255,255,0.15);padding-top:12px;margin-top:12px;}

@media(min-width:600px){
  .art-card img{width:170px;min-width:170px;}
}
</style>
</head>
<body>

<header>
  <div class="logo">S</div>
  <div>
    <h1>Sonko Archives TV</h1>
    <div class="tag">Le site des patriotes</div>
  </div>
</header>
<div class="datebar" id="dateBar"></div>
<div class="announce-bar" id="announceBar" style="display:none;">
  <span class="ann-x" onclick="dismissAnnounce()">×</span>
  <div class="ann-track"><span id="announceTxt"></span></div>
</div>
<div class="ad-slot" style="max-width:760px;margin:14px auto 0;">Emplacement publicité (AdSense)</div>

<main id="main">
  <div class="loader">Chargement…</div>
</main>

<footer>
  <div class="ft-inner">
    <div class="ft-name">Sonko Archives TV</div>
    <div class="ft-tag">Le site des patriotes — actualités, archives et analyses</div>
    <div class="ft-copy">© <span id="ftYear"></span> Sonko Archives TV. Tous droits réservés.</div>
  </div>
</footer>

<!-- Emplacement publicité Google AdSense — remplacer data-ad-client par ton vrai identifiant
     éditeur une fois ton compte AdSense approuvé (pub.google.com), et coller le script de
     chargement AdSense officiel dans le <head> à ce moment-là. -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const API = ''; // même domaine que le site (Render sert aussi le site) — laisser vide
const main = document.getElementById('main');
document.getElementById('ftYear').textContent = new Date().getFullYear();
document.getElementById('dateBar').innerHTML = '<b>' + fmtDate(new Date()).replace(/^./, c => c.toUpperCase()) + '</b>';

// ---- Bannière d'annonce : administrée depuis /sonko-admin (texte + activation stockés en
// base). Se souvient si CETTE annonce précise a déjà été fermée (clé par texte, donc un
// nouveau texte réapparaît automatiquement même si une ancienne annonce avait été fermée). ----
async function initAnnounce(){
  try{
    const r = await fetch(API + '/api/sonko/announcement');
    const j = await r.json();
    if(!j.enabled || !j.text) return;
    const key = 'sonko_ann_dismissed_' + btoa(unescape(encodeURIComponent(j.text))).slice(0,24);
    if(localStorage.getItem(key) === '1') return;
    document.getElementById('announceTxt').textContent = j.text;
    document.getElementById('announceBar').style.display = 'flex';
    window._annKey = key;
  }catch(e){}
}
initAnnounce();
function dismissAnnounce(){
  document.getElementById('announceBar').style.display = 'none';
  try{ localStorage.setItem(window._annKey, '1'); }catch(e){}
}

function renderVideo(url){
  let embedSrc = null;
  const yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]+)/);
  if(yt) embedSrc = 'https://www.youtube.com/embed/' + yt[1];
  else if(url.includes('facebook.com')) embedSrc = 'https://www.facebook.com/plugins/video.php?href=' + encodeURIComponent(url);
  if(embedSrc){
    const ytLink = yt ? `<a href="${esc(url)}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--red);margin:-8px 0 16px;">▶ Voir directement sur YouTube</a>` : '';
    return `<div class="art-video-wrap"><iframe src="${esc(embedSrc)}" allowfullscreen frameborder="0"></iframe></div>${ytLink}`;
  }
  return `<video class="art-video-file" src="${esc(url)}" controls></video>`;
}

function esc(s){ return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmtDate(d){ return new Date(d).toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long', year:'numeric'}); }
function fmtDateShort(d){ return new Date(d).toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'}); }

const CATEGORIES = ['Tout','Actualité','Politique','Économie','Société','International','Vidéos'];
let currentCat = 'Tout';
let allArticles = [];

function renderCatTabs(){
  return `<div class="cat-tabs">${CATEGORIES.map(c => `<button class="cat-tab${c===currentCat?' active':''}" onclick="filterCat('${c}')">${c}</button>`).join('')}</div>`;
}
function filterCat(c){
  currentCat = c;
  renderArticleList();
}

function renderCard(a){
  return `
    <div class="art-card" onclick="navigateTo('/sonko/a/${a.id}')">
      ${a.image_url ? `<img src="${esc(a.image_url)}" alt="">` : ''}
      <div class="body">
        <span class="cat-badge">${esc(a.category || 'Actualité')}</span>
        <h2>${esc(a.title)}</h2>
        ${a.excerpt ? `<p>${esc(a.excerpt)}</p>` : ''}
        <div class="art-meta">
          <span>${fmtDateShort(a.created_at)}</span><span class="sep">·</span><span>${a.reading_minutes} min</span>
        </div>
      </div>
    </div>
  `;
}
function renderHero(a){
  return `
    <div class="hero-card" onclick="navigateTo('/sonko/a/${a.id}')">
      ${a.image_url ? `<img src="${esc(a.image_url)}" alt="">` : ''}
      <div class="body">
        <div class="une-eyebrow">À la une</div>
        <span class="cat-badge">${esc(a.category || 'Actualité')}</span>
        <h2>${esc(a.title)}</h2>
        ${a.excerpt ? `<p>${esc(a.excerpt)}</p>` : ''}
        <div class="art-meta">
          <span>${esc(a.author||'')}</span><span class="sep">·</span><span>${fmtDateShort(a.created_at)}</span><span class="sep">·</span><span>${a.reading_minutes} min</span>
        </div>
        <div class="read-cta">Lire l'article →</div>
      </div>
    </div>
  `;
}
function renderPopular(){
  const ranked = allArticles.slice().sort((a,b) => (b.views||0) - (a.views||0)).slice(0,5);
  if(!ranked.length) return '';
  return `
    <div class="popular-box">
      <h3>ARTICLES LES PLUS LUS</h3>
      ${ranked.map(a => `<div class="popular-item" onclick="navigateTo('/sonko/a/${a.id}')"><span class="sq">■</span><span>${esc(a.title)}</span></div>`).join('')}
    </div>
  `;
}
function renderArticleList(){
  const filtered = currentCat === 'Tout' ? allArticles : allArticles.filter(a => (a.category||'Actualité') === currentCat);
  if(!filtered.length){
    main.innerHTML = renderCatTabs() + '<div class="empty">Aucun article dans cette rubrique.</div>';
    return;
  }
  let html = renderCatTabs();
  if(currentCat === 'Tout'){
    html += renderHero(filtered[0]);
    html += renderPopular();
    html += filtered.slice(1).map(renderCard).join('');
  } else {
    html += filtered.map(renderCard).join('');
  }
  main.innerHTML = html;
}

async function loadHome(){
  main.innerHTML = renderCatTabs() + '<div class="loader">Chargement des articles…</div>';
  try{
    const r = await fetch(API + '/api/sonko/articles');
    const j = await r.json();
    allArticles = j.articles || [];
    if(!allArticles.length){
      main.innerHTML = '<div class="empty">Aucun article publié pour le moment.</div>';
      return;
    }
    renderArticleList();
  }catch(e){
    main.innerHTML = '<div class="empty">Impossible de charger les articles. Réessaie plus tard.</div>';
  }
}

// ---- Contenu de l'article : découpé en paragraphes puis en phrases repérables, pour
// afficher de vrais paragraphes, insérer de la pub entre eux, et synchroniser la lecture
// audio ET la surbrillance en temps réel (avec une pause plus marquée en fin de paragraphe).
let ttsParaEnd = []; // ttsParaEnd[i] = true si le morceau i termine un paragraphe
function renderContent(text){
  const paragraphs = text.split(/\n+/).map(p => p.trim()).filter(Boolean);
  ttsQueue = []; ttsParaEnd = [];
  let html = '';
  paragraphs.forEach((para, pi) => {
    const chunks = splitForTTS(para);
    let paraHtml = '<p>';
    chunks.forEach((c) => {
      const idx = ttsQueue.length;
      ttsQueue.push(c);
      ttsParaEnd.push(false);
      paraHtml += `<span class="tts-chunk" id="tts-${idx}">${esc(c)}</span> `;
    });
    if(ttsParaEnd.length) ttsParaEnd[ttsParaEnd.length - 1] = true;
    paraHtml += '</p>';
    html += paraHtml;
    // Une pub tous les 3 paragraphes, jamais au tout début ni à la toute fin
    if((pi + 1) % 3 === 0 && pi < paragraphs.length - 1){
      html += '<div class="ad-slot ad-slot-inline">Emplacement publicité (AdSense)</div>';
    }
  });
  document.getElementById('artContent').innerHTML = html;
  ttsIdx = 0;
}

// ---- Lecture audio : découpe chaque paragraphe en morceaux <200 caractères (limite du
// moteur gratuit), les joue les uns après les autres en surlignant en direct la phrase en
// cours, avec une pause plus longue en fin de paragraphe qu'entre deux phrases. ----
let ttsQueue = [], ttsIdx = 0, ttsAudio = null, ttsPlaying = false;
function splitForTTS(text){
  const sentences = text.replace(/\s+/g,' ').trim().split(/(?<=[.!?])\s+/);
  const chunks = []; let cur = '';
  function flush(){ if(cur.trim()){ chunks.push(cur.trim()); } cur = ''; }
  for(let s of sentences){
    while(s.length > 190){
      let cut = s.lastIndexOf(' ', 190);
      if(cut < 50) cut = 190;
      flush();
      chunks.push(s.slice(0, cut).trim());
      s = s.slice(cut).trim();
    }
    if((cur + ' ' + s).trim().length > 190){
      flush();
      cur = s;
    } else {
      cur = (cur + ' ' + s).trim();
    }
  }
  flush();
  return chunks;
}
function playNextChunk(){
  document.querySelectorAll('.tts-chunk.tts-active').forEach(s => s.classList.remove('tts-active'));
  if(ttsIdx >= ttsQueue.length){ ttsPlaying = false; updateTTSBtn(); return; }
  const span = document.getElementById('tts-' + ttsIdx);
  if(span){ span.classList.add('tts-active'); span.scrollIntoView({block:'center', behavior:'smooth'}); }
  const lang = window._ttsLang || 'fr';
  const wasParaEnd = ttsParaEnd[ttsIdx];
  ttsAudio = new Audio(API + '/api/sonko/tts?lang=' + lang + '&text=' + encodeURIComponent(ttsQueue[ttsIdx]));
  ttsAudio.playbackRate = window._ttsRate || 1;
  ttsAudio.onended = () => {
    ttsIdx++;
    setTimeout(playNextChunk, wasParaEnd ? 550 : 120); // vraie pause en fin de paragraphe
  };
  ttsAudio.onerror = () => { ttsIdx++; playNextChunk(); };
  ttsAudio.play().catch(()=>{});
}
function toggleTTS(){
  if(ttsPlaying){
    if(ttsAudio) ttsAudio.pause();
    ttsPlaying = false; updateTTSBtn(); return;
  }
  if(ttsQueue.length === 0) return;
  ttsPlaying = true; updateTTSBtn();
  // Reprendre EXACTEMENT où on s'était arrêté (même fichier audio, même position) au lieu
  // de recréer un nouveau son qui recommencerait la phrase depuis le début.
  if(ttsAudio && ttsAudio.paused && !ttsAudio.ended){
    ttsAudio.play().catch(()=>{});
  } else {
    if(ttsIdx >= ttsQueue.length) ttsIdx = 0;
    playNextChunk();
  }
}
function setTTSRate(rate){
  window._ttsRate = rate;
  if(ttsAudio) ttsAudio.playbackRate = rate;
  document.querySelectorAll('.rate-btn').forEach(b => b.classList.toggle('active', parseFloat(b.dataset.rate) === rate));
}
function updateTTSBtn(){
  const b = document.getElementById('ttsBtn');
  if(!b) return;
  b.classList.toggle('active', ttsPlaying);
  b.querySelector('.lbl').textContent = ttsPlaying ? 'Pause' : 'Écouter';
}

async function toggleTranslate(){
  if(!currentArticleData) return;
  const originalText = currentArticleData.content;
  const el = document.getElementById('artContent');
  const btn = document.getElementById('trBtn');
  if(el.dataset.translated === '1'){
    renderContent(originalText);
    el.dataset.translated = '0';
    btn.classList.remove('active');
    window._ttsLang = 'fr';
    return;
  }
  btn.querySelector('.lbl').textContent = 'Traduction…';
  try{
    // Un seul gros appel échouait parfois sur les articles longs (limite de l'endpoint
    // gratuit de Google) -- on découpe en paragraphes, chacun traduit séparément.
    const paragraphs = originalText.split(/\n+/).filter(p => p.trim());
    const translatedParts = [];
    for(const p of paragraphs){
      const u = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=' + encodeURIComponent(p);
      const r = await fetch(u);
      const j = await r.json();
      translatedParts.push((j[0] || []).map(x => x[0]).join(''));
    }
    const translated = translatedParts.join('\n\n');
    renderContent(translated || originalText);
    el.dataset.translated = '1';
    btn.classList.add('active');
    window._ttsLang = 'en';
  }catch(e){ /* laisse le texte original si la traduction échoue */ }
  btn.querySelector('.lbl').textContent = el.dataset.translated === '1' ? 'Traduit' : 'Traduire (EN)';
}

// ---- Téléchargement de l'article en PDF — mise en page simple et propre (titre, infos,
// texte), pour que les lecteurs puissent le garder ou l'imprimer, comme un vrai journal. ----
function downloadArticlePDF(a){
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:'pt', format:'a4' });
    const marginX = 50; const pageW = doc.internal.pageSize.getWidth(); const maxW = pageW - marginX*2;
    let y = 60;
    doc.setFont('times','bold'); doc.setFontSize(20);
    const titleLines = doc.splitTextToSize(a.title, maxW);
    doc.text(titleLines, marginX, y); y += titleLines.length*24 + 10;
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(110,100,85);
    doc.text(`${a.author||''} — ${fmtDateShort(a.created_at)} — Sonko Archives TV`, marginX, y); y += 22;
    doc.setDrawColor(174,31,38); doc.setLineWidth(1.2); doc.line(marginX, y, pageW-marginX, y); y += 20;
    doc.setFont('times','normal'); doc.setFontSize(12); doc.setTextColor(28,23,18);
    const paragraphs = (a.content||'').split(/\n+/).map(p=>p.trim()).filter(Boolean);
    paragraphs.forEach(p => {
      const lines = doc.splitTextToSize(p, maxW);
      lines.forEach(line => {
        if(y > 780){ doc.addPage(); y = 60; }
        doc.text(line, marginX, y); y += 16;
      });
      y += 10;
    });
    doc.save((a.title||'article').slice(0,60).replace(/[^\w\- ]/g,'').trim() + '.pdf');
  }catch(e){ alert('Téléchargement indisponible pour le moment.'); }
}

function myCommentToken(id){ return localStorage.getItem('sonko_ctok_' + id) || ''; }

function renderComment(c){
  const tok = myCommentToken(c.id);
  return `<div class="c-item" id="c-${c.id}">
    <div class="name">${esc(c.name)}</div>
    <div class="txt" id="ctxt-${c.id}">${esc(c.content)}</div>
    ${tok ? `<button class="edit-c-btn" onclick="editComment('${c.id}')">Modifier</button>` : ''}
  </div>`;
}
function editComment(id){
  const wrap = document.getElementById('c-' + id);
  const current = document.getElementById('ctxt-' + id).textContent;
  wrap.innerHTML = `
    <textarea id="cEdit-${id}" rows="3" style="width:100%;border:1px solid var(--rule);padding:8px;font-family:inherit;font-size:14px;">${esc(current)}</textarea>
    <button class="edit-c-btn" onclick="saveComment('${id}')">Enregistrer</button>
  `;
}
async function saveComment(id){
  const content = document.getElementById('cEdit-' + id).value.trim();
  if(!content) return;
  try{
    const r = await fetch(API + '/api/sonko/comments/' + id, {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ content, edit_token: myCommentToken(id) })
    });
    const j = await r.json();
    if(j.success) loadArticle(currentArticleId);
    else alert(j.error || 'Modification refusée.');
  }catch(e){ alert('Erreur réseau.'); }
}

async function react(articleId, emoji){
  try{ await fetch(API + '/api/sonko/articles/' + articleId + '/react', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({emoji})}); }catch(e){}
  loadArticle(articleId);
}

async function shareArticle(id, title){
  const url = location.origin + '/sonko/a/' + id;
  if(navigator.share){
    try{ await navigator.share({ title, url }); return; }catch(e){ return; } // annulé ou échoué : rien à faire
  }
  try{
    await navigator.clipboard.writeText(url);
    alert('Lien copié : ' + url);
  }catch(e){
    prompt('Copie ce lien :', url);
  }
}
// Sécurité/fiabilité (Sept 2026) : ces fonctions lisaient avant leur id/titre via des
// paramètres injectés dans l'attribut onclick avec JSON.stringify(...) — qui produit une
// chaîne ENTOURÉE DE GUILLEMETS DOUBLES, insérée telle quelle dans un attribut HTML lui-même
// délimité par des guillemets doubles. Résultat : le HTML se coupait dès le premier titre
// d'article rencontré, cassant silencieusement TOUS les boutons de partage/traduction, quel
// que soit l'article. On lit maintenant directement `currentArticleData` (déjà en mémoire
// depuis le chargement de l'article) — aucune donnée à faire transiter par un attribut HTML.
function shareTo(net){
  if(!currentArticleData) return;
  const url = encodeURIComponent(location.origin + '/sonko/a/' + currentArticleData.id);
  const t = encodeURIComponent(currentArticleData.title || '');
  const map = {
    fb: 'https://www.facebook.com/sharer/sharer.php?u=' + url,
    x: 'https://twitter.com/intent/tweet?url=' + url + '&text=' + t,
    wa: 'https://api.whatsapp.com/send?text=' + t + '%20' + url,
    tg: 'https://t.me/share/url?url=' + url + '&text=' + t,
    mail: 'mailto:?subject=' + t + '&body=' + url
  };
  if(map[net]) window.open(map[net], '_blank', 'noopener');
}

async function submitComment(e, articleId){
  e.preventDefault();
  const name = document.getElementById('cName').value.trim();
  const content = document.getElementById('cText').value.trim();
  if(!name || !content) return;
  try{
    const r = await fetch(API + '/api/sonko/articles/' + articleId + '/comments', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name, content})});
    const j = await r.json();
    if(j.success && j.edit_token) localStorage.setItem('sonko_ctok_' + j.id, j.edit_token);
    document.getElementById('cText').value = '';
    loadArticle(articleId);
  }catch(e){}
}

let currentArticleId = null;
let currentArticleData = null;

          <span class="lbl">Télécharger</span>
        </button>
      </div>
      <div class="art-content" id="artContent"></div>

      ${a.tags ? `<div class="tag-list">${a.tags.split(',').map(t => t.trim()).filter(Boolean).map(t => `<span class="tag-pill">${esc(t)}</span>`).join('')}</div>` : ''}

      <div class="ad-slot">Emplacement publicité (AdSense)</div>

        <form class="c-form" onsubmit="submitComment(event,'${a.id}')">

function navigateTo(path){
  history.pushState({}, '', path);
  route();
  window.scrollTo(0,0);
}
function route(){
  const p = location.pathname;
  const m = p.match(/\/sonko\/a\/([^/]+)/);
  if(m) loadArticle(m[1]);
  else loadHome();
}
window.addEventListener('popstate', route);
route();
</script>
